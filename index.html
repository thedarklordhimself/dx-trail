}

// ================= FACT CARD =================
// "Read more": all ad-free, checked 27 Sep 2026. Dinosaurs go to the museum; the flying and sea reptiles
// (which the museum's directory leaves out) go to Simple English Wikipedia, written for young readers.
const SIMPLE_WIKI = ['pteranodon', 'quetzalcoatlus', 'rhamphorhynchus', 'eudimorphodon', 'mosasaurus', 'plesiosaurus', 'ichthyosaurus', 'elasmosaurus', 'shonisaurus', 'brontosaurus'];
const FULL_WIKI = ['nothosaurus', 'postosuchus'];
function readMore(c) {
  const title = encodeURIComponent(c.name.replace(/ /g, '_'));
  const [href, label] = MUSEUM[c.id] ? [`https://www.nhm.ac.uk/discover/dino-directory/${MUSEUM[c.id]}.html`, '🏛️ Read more at the Natural History Museum']
    : SIMPLE_WIKI.includes(c.id) ? [`https://simple.wikipedia.org/wiki/${title}`, '📚 Read more (Simple English Wikipedia)']
    : FULL_WIKI.includes(c.id) ? [`https://en.wikipedia.org/wiki/${title}`, '📚 Read more on Wikipedia'] : [];
  return href ? `<a class="pill readmore" href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>` : '';
}
function factCard(c, o = {}) {
  const photo = o.photo || photoOf(c.id);
  const E = ERAS[c.era], D = DIETS[c.diet], K = KINDS[c.kind], cmp = sizeCompare(c);
  const all = [c.name + '.', `Its name means ${c.meaning}.`, K.note, `It lived in the ${E.name} period, about ${c.mya} million years ago.`,
    `It was a ${D.word}.`, `${sizeLine(c)}. That is ${cmp.text}.`, `It weighed ${c.weight}.`, `It was found in ${noFlags(c.where)}.`, 'Fun facts!', ...c.facts].filter(Boolean).join(' ');
  const inPark = S.park.some(p => p.id === c.id) || S.eggs.some(p => p.id === c.id);
  let action = '';
  if (S.found[c.id]) {
    action = inPark ? `<button class="pill done" disabled>✅ Already in your park</button>`
      : `<button class="pill take">${c.kind === 'sea' ? '🌊 Bring a baby to my lagoon' : '🥚 Take an egg to my park'}</button>`;
  }
  const m = modal(`
    <div class="card c-${c.era}">
      ${o.isNew ? '<div class="newbadge">✨ New discovery! +1 ⭐</div>' : ''}
      <div class="card-pic">${c.fav ? '<span class="fav">❤️</span>' : ''}<img class="real-pic" src="assets/portraits/${c.id}.webp" alt="" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.art))" data-art="${esc(Art.svg(c).html)}"></div>
      ${photo ? `<figure class="myphoto"><img src="${photo}" alt=""><figcaption>📷 Your photo</figcaption></figure>` : ''}
      <h2>${esc(c.name)} ${spk(c.name)}</h2>
      <p class="pron">Say it: <b>${esc(c.pron)}</b> <button class="spk slow" data-say="${esc(c.name)}" data-rate="0.55" aria-label="Say it slowly">🐢</button></p>
      <p class="meaning">Name means: <b>“${esc(c.meaning)}”</b> ${spk(`${c.name} means ${c.meaning}.`)}</p>
      ${K.note ? `<p class="note">${esc(K.note)} ${spk(K.note)}</p>` : ''}
      <div class="chips">
        <button class="chip" data-say="${esc(`It lived in the ${E.name} period, about ${c.mya} million years ago.`)}"><span>🕰️</span><b>${E.name}</b><small>${c.mya} million years ago</small></button>
        <button class="chip" data-say="${esc(`It was a ${D.word}. The science word is ${D.sci}.`)}"><span>${D.e}</span><b>${cap(D.word)}</b><small>${D.sci}</small></button>
        <button class="chip" data-say="${esc(`${sizeLine(c)}. That is ${cmp.text}.`)}"><span>📏</span><b>${sizeLine(c)}</b><small>${cmp.icons} ${cmp.text}</small></button>
        <button class="chip" data-say="${esc(`It weighed ${c.weight}.`)}"><span>⚖️</span><b>${cap(esc(c.weight))}</b></button>
        <button class="chip wide" data-say="${esc(`It was found in ${noFlags(c.where)}.`)}"><span>🌍</span><b>Found in ${esc(c.where)}</b></button>
      </div>
      <div class="call-row">${HAS_MOVIE(c) ? '<button class="pill call-btn movie-btn">🎬 Movie roar</button>' : ''}<button class="pill call-btn real-btn">📣 ${HAS_MOVIE(c) ? 'Real call' : 'Hear its call'}</button><p><span>${esc(CALL_WHY[callOf(c)])}</span> ${spk(CALL_WHY[callOf(c)])}</p></div>
      <button class="pill readall" data-say="${esc(all)}">🔊 Read me everything</button>
      <h3>Fun facts</h3>
      <ul class="facts">${c.facts.map(f => `<li>${spk(f)}<span>${esc(f)}</span></li>`).join('')}</ul>
      ${MORE[c.id] ? `<button class="pill readmore more-btn">📖 More about ${esc(nm(c))}</button>` : ''}
      <div class="card-actions">${action}</div>
    </div>`, { cls: 'm-card', onClose: o.onClose });
  const mb = $('.more-btn', m); if (mb) mb.onclick = () => moreAbout(c);
  $('.real-btn', m).onclick = () => Sfx.call(c);
  const mv = $('.movie-btn', m); if (mv) mv.onclick = () => { Sfx.movieRoar(c); toast('🎬 ' + MOVIE_WHY, 7000); };
  const t = $('.take', m);
  if (t) t.onclick = () => {
    if (c.kind === 'sea') {
      S.park.push({ uid: newId(), id: c.id, nick: '', friend: 0, fed: false, grown: false, born: Date.now() });
      save(); Sfx.play('splash');
      t.outerHTML = `<button class="pill done" disabled>✅ Baby is in your lagoon!</button>`;
      const msg = `Sea reptiles like ${nm(c)} did not lay eggs. They gave birth to live babies in the water, just like dolphins! Your baby ${nm(c)} is waiting in your park's lagoon.`;
      $('.card-actions', m).insertAdjacentHTML('beforeend', `<p class="info">${msg} ${spk(msg)}</p>`);
      checkBadges();
    } else {
      S.eggs.push({ uid: newId(), id: c.id, warm: 0 });
      save(); Sfx.play('pop');
      t.outerHTML = `<button class="pill done" disabled>✅ Egg is in your park's nest!</button>`;
      const msg = `The egg is waiting in the nest in your park. Tap it to keep it warm and help it hatch!`;
      $('.card-actions', m).insertAdjacentHTML('beforeend', `<p class="info">🥚 ${msg} ${spk(msg)}</p>`);
    }
  };
  return m;
}

// ================= PARK =================
let parkScroll = 0;
SCREENS.park2d = app => {
  app.innerHTML = bar('My Dino Park', { extra: `<button class="btn-round deco-btn" aria-label="Decorate">🎨</button>` }) +
    `<div class="scroller"><div class="scene park-scene"></div></div><div class="deco-bar hidden"></div>`;
  const scroller = $('.scroller', app), scene = $('.scene', app);
  const H = scroller.clientHeight, K0 = Math.max(0.5, Math.min(1.3, H / 600, scroller.clientWidth / 450));
  const eggCols = Math.min(Math.max(S.eggs.length, 2), 6);
  const nestW = S.eggs.length ? Math.round((eggCols * 52 + 50) * K0) : 0;
  const items = S.park.filter(p => BY_ID[p.id]).map(p => ({ c: BY_ID[p.id], p, scale: p.grown ? 1 : 0.55 + 0.035 * Math.min(10, p.friend),
    badge: `<div class="tag">${p.nick ? esc(p.nick) : ''}${p.grown ? '' : ' 🍼'}</div>` }));
  let decoMode = false, sel = null;
  const world = buildScene(scene, scroller, 'park', items, { lagoon: true, leftPad: nestW + 20, minScreens: 1.8, onTap: a => { if (!decoMode) careSheet(a.item.p); } });
  cleanup = () => { world.stop(); parkScroll = scroller.scrollLeft; };
  // decorations
  const drawDecor = () => {
    $$('.decor', scene).forEach(d => d.remove());
    S.decor.forEach((d, i) => {
      const big = ['🌲', '🌴', '🌳', '🌋'].includes(d.e);
      const size = (big ? 74 : d.e === '☄️' ? 56 : 40) * world.K;
      const b = d.y * world.H;
      world.layer.appendChild(el(`<span class="decor" data-i="${i}" style="left:${Math.round(d.x * world.W)}px;bottom:${Math.round(b)}px;font-size:${Math.round(size)}px;z-index:${Math.round(1000 - b)}">${d.e}</span>`));
    });
  };
  drawDecor();
  // nest
  if (S.eggs.length) {
    const nest = el(`<div class="nest" style="left:${Math.round(12 * K0)}px;bottom:${Math.round(world.groundH * 0.18)}px;width:${nestW}px;--k:${K0}">
      <div class="nest-label">🥚 Tap an egg to keep it warm!</div>
      <div class="eggs">${S.eggs.map(e => `<button class="egg" data-uid="${e.uid}" aria-label="Egg">${Art.egg(BY_ID[e.id], e.warm >= 4 ? 2 : e.warm >= 2 ? 1 : 0)}</button>`).join('')}</div>
      <div class="straw"></div></div>`);
    world.layer.appendChild(nest);
    $$('.egg', nest).forEach(b => b.onclick = ev => { ev.stopPropagation(); if (!decoMode) warmEgg(b); });
  }
  if (!S.park.length && !S.eggs.length) {
    const msg = 'Your park is empty! Hop in the Time Machine, meet some dinosaurs, and bring an egg back home.';
    scroller.insertAdjacentHTML('afterend', `<div class="empty-park"><p>🥚 ${msg} ${spk(msg)}</p><button class="pill" data-go="timemachine">⏳ Go to the Time Machine</button></div>`);
  }
  requestAnimationFrame(() => { scroller.scrollLeft = parkScroll; });

  function warmEgg(b) {
    const e = S.eggs.find(x => x.uid === b.dataset.uid);
    if (!e) return;
    const c = BY_ID[e.id];
    e.warm++; save();
    b.classList.remove('wobble'); void b.offsetWidth; b.classList.add('wobble');
    burst(b, ['💛', '✨', '🔥'], 3);
    if (e.warm < 5) {
      Sfx.play(e.warm >= 2 ? 'crack' : 'pop');
      b.innerHTML = Art.egg(c, e.warm >= 4 ? 2 : e.warm >= 2 ? 1 : 0);
      return;
    }
    Sfx.play('hatch');
    S.eggs = S.eggs.filter(x => x.uid !== e.uid);
    const p = { uid: newId(), id: e.id, nick: '', friend: 0, fed: false, grown: false, born: Date.now() };
    S.park.push(p); save();
    giveStars(1);
    nameBaby(p, true);
  }

  // decorate mode
  const dbar = $('.deco-bar', app);
  const drawBar = () => {
    dbar.innerHTML = `<div class="deco-help">Pick something, then tap your park to put it there. Tap a decoration to take it back. ${spk('Pick something, then tap your park to put it there. Tap a decoration to take it back and get your stars back.')}</div>
      <div class="deco-items">${DECOR.map((d, i) => `<button class="deco-item${sel === i ? ' sel' : ''}${S.stars < d.cost ? ' poor' : ''}" data-i="${i}"><span>${d.e}</span><small>⭐${d.cost}</small></button>`).join('')}</div>`;
    $$('.deco-item', dbar).forEach(b => b.onclick = () => { sel = +b.dataset.i; Sfx.play('pop'); drawBar(); });
  };
  $('.deco-btn', app).onclick = () => {
    decoMode = !decoMode; sel = null;
    dbar.classList.toggle('hidden', !decoMode);
    app.classList.toggle('decorating', decoMode);
    $('.deco-btn', app).textContent = decoMode ? '✅' : '🎨';
    if (decoMode) drawBar();
  };
  scene.addEventListener('click', ev => {
    if (!decoMode) return;
    const d = ev.target.closest('.decor');
    if (d) {
      const item = S.decor[+d.dataset.i], def = DECOR.find(x => x.e === item.e);
      S.decor.splice(+d.dataset.i, 1); S.stars += def ? def.cost : 0; save(); updateStars(); drawDecor(); drawBar(); Sfx.play('boing');
      return;
    }
    if (sel === null) { toast('👇 Pick a decoration first!'); return; }
    const def = DECOR[sel];
    if (S.stars < def.cost) { toast(`You need ${def.cost - S.stars} more ⭐. Play Dino Detective to earn stars!`); Sfx.play('oops'); return; }
    const r = scene.getBoundingClientRect();
    const x = (ev.clientX - r.left) / world.W, y = Math.max(0.01, (r.bottom - ev.clientY) / world.H - 0.02);
    S.decor.push({ e: def.e, x, y }); S.stars -= def.cost; save(); updateStars(); drawDecor(); drawBar(); Sfx.play('place');
    if (!S.decorSeen[def.e]) {
      S.decorSeen[def.e] = 1; save();
      const m = modal(`<div class="didyou"><div class="dy-e">${def.e}</div><h2>Did you know? ${spk(def.fact)}</h2><p>${esc(def.fact)}</p><button class="pill ok-btn">OK!</button></div>`);
      $('.ok-btn', m).onclick = m.close;
    }
    checkBadges();
  });
};

// what the 3D park may read and change; all saving stays here
const NEEDS = { feed: 'the right food', cuddle: 'a cuddle', bath: 'a bath', play: 'a game' };
const parkApi = {
  name: () => S.name,
  stats: () => ({ met: nFound(), friends: S.park.filter(p => BY_ID[p.id]).length, eggs: S.eggs.length, stars: S.stars, since: S.created }),
  list: () => S.park.filter(p => BY_ID[p.id]),
  eggs: () => S.eggs.filter(e => BY_ID[e.id]),
  // creatures she has met that are not in the park yet: she can order their egg
  candidates: () => CREATURES.filter(c => S.found[c.id] && !S.park.some(p => p.id === c.id) && !S.eggs.some(e => e.id === c.id)).map(c => c.id),
  takeEgg(id) {
    const c = BY_ID[id]; if (!c) return null;
    if (c.kind === 'sea') { const p = { uid: newId(), id, nick: '', friend: 0, fed: false, grown: false, born: Date.now() }; S.park.push(p); save(); checkBadges(); return { sea: p }; }
    const e = { uid: newId(), id, warm: 0 }; S.eggs.push(e); save(); return { egg: e };
  },
  warm(uid) {
    const e = S.eggs.find(x => x.uid === uid); if (!e) return null;
    e.warm++; save();
    if (e.warm < 5) return { warm: e.warm };
    S.eggs = S.eggs.filter(x => x.uid !== uid);
    const p = { uid: newId(), id: e.id, nick: '', friend: 0, fed: false, grown: false, born: Date.now() };
    S.park.push(p); save(); giveStars(1); checkBadges();
    return { hatched: p };
  },
  nameBaby: (uid, born, onDone) => { const p = S.park.find(x => x.uid === uid); if (p) nameBaby(p, born, onDone); },
  facts: id => factCard(BY_ID[id]),
  stars: () => S.stars,
  decorItems: () => PARK_DECOR,
  decor: () => S.decor3d,
  // a statue shows one of the dinosaurs she has met
  metIds: () => CREATURES.filter(c => S.found[c.id]).map(c => c.id),
  placeDecor(e, x, z, r, s) {
    const d = PARK_DECOR.find(k => k.e === e); if (!d) return null;
    if (S.stars < d.cost) return { poor: d.cost - S.stars };
    S.stars -= d.cost; const item = { id: newId(), e, x, z, r, s }; S.decor3d.push(item); save(); updateStars(); Sfx.play('place'); checkBadges();
    if (!S.decorSeen[e]) {
      S.decorSeen[e] = 1; save();
      const m = modal(`<div class="didyou"><div class="dy-e">${e}</div><h2>Did you know? ${spk(d.fact)}</h2><p>${esc(d.fact)}</p><button class="pill ok-btn">OK!</button></div>`);
      $('.ok-btn', m).onclick = m.close;
    }
    return { item };
  },
  removeDecor(id) {
    const i = S.decor3d.findIndex(k => k.id === id); if (i < 0) return 0;
    const d = PARK_DECOR.find(k => k.e === S.decor3d[i].e), back = d ? d.cost : 0;
    S.decor3d.splice(i, 1); S.stars += back; save(); updateStars(); Sfx.play('boing');
    return back;
  },
  foods: () => Object.entries(FOODS).map(([k, f]) => ({ k, e: f.e, name: f.name })),
  // one care action; returns what to say and whether the baby just grew up
  care(uid, act, food) {
    const p = S.park.find(x => x.uid === uid); if (!p) return null;
    const c = BY_ID[p.id], Who = p.nick || `Your ${nm(c)}`, who = p.nick || `your ${nm(c)}`;
    let msg = '', n = 1;
    if (act === 'feed') {
      const f = FOODS[food];
      if (!c.foods.includes(food)) return { wrong: true, msg: `Hmm, ${who} sniffs the ${f.name} and turns away. ${nm(c)} was a ${DIETS[c.diet].word}. Try something else!` };
      msg = `Yum! ${Who} loved the ${f.name}! ${c.eat}`; n = 2; S.stats.fed++; p.fed = true;
      if (!S.fedOnce[c.id]) { S.fedOnce[c.id] = 1; giveStars(1); msg += ' You earned a star!'; }
    } else if (act === 'bath') msg = c.kind === 'sea' ? `${Who} splashes and swims in circles!` : pick([`Splish splash! ${Who} is squeaky clean!`, `${Who} loves the bubbles!`]);
    else if (act === 'play') msg = c.kind === 'ptero' ? `${Who} swoops down to catch the ball!` : c.kind === 'sea' ? `${Who} bounces the ball on its nose!` : pick([`${Who} chases the ball!`, `Wheee! ${Who} loves playing ball!`]);
    else if (act === 'cuddle') msg = pick([`${Who} loves cuddles!`, `Aww! ${Who} is so happy!`, `${Who} snuggles up to you!`]);
    p.did = p.did || {}; p.did[act] = 1;
    p.friend = Math.min(10, p.friend + n); save();
    let grew = false;
    if (!p.grown && p.friend >= 10) {
      const need = Object.keys(NEEDS).filter(k => !p.did[k]).map(k => k === 'bath' && c.kind === 'sea' ? 'a splash' : NEEDS[k]);
      if (need.length) msg += ` ${Who} loves you! To grow up big, it also needs ${need.length > 1 ? need.slice(0, -1).join(', ') + ' and ' + need[need.length - 1] : need[0]}.`;
      else { p.grown = true; grew = true; save(); giveStars(3); msg = `Wow! ${Who} is all grown up! Look how big it is now! You get 3 stars!`; }
    }
    checkBadges();
    return { msg, grew, friend: p.friend, grown: p.grown };
  }
};

        p.fed = true; save(); say(msg); box.classList.add('hidden'); friendUp(2, 'feed'); checkBadges();

  };
  $('.facts', m).onclick = () => { m.close(); factCard(c); };

const QUIZZES = [
  { id: 'who', e: '🕵️', name: 'Who am I?', desc: 'Guess the creature from clues' },
  { id: 'food', e: '🍽️', name: "What's for dinner?", desc: 'What did it eat?' },
  { id: 'when', e: '⏳', name: 'When did I live?', desc: 'Triassic, Jurassic or Cretaceous?' },
  { id: 'size', e: '📏', name: 'Who was longer?', desc: 'Pick the bigger one' },
  { id: 'tf', e: '✅', name: 'True or false?', desc: 'Is it a real fact?' },
  { id: 'mix', e: '🎲', name: 'Mix it up!', desc: 'A bit of everything' }
];
SCREENS.quizmenu = app => {
  app.innerHTML = bar('Dino Detective') + `
  <div class="qmenu">
    <p class="lead">Pick a game! ${spk('Pick a game! Answer questions to earn stars. There is no timer, so take your time.')}</p>
    <div class="qgrid">${QUIZZES.map(q => `<button class="qcard" data-go="quiz" data-arg="${q.id}"><span>${q.e}</span><b>${q.name}</b><small>${q.desc}</small></button>`).join('')}</div>
    <p class="qstats">🧠 You have answered <b>${S.stats.correct}</b> questions right!</p>
  </div>`;
};

SCREENS.quiz = (app, type) => {
  const Q = QUIZZES.find(q => q.id === type) || QUIZZES[5];
  const N = 5;
  let i = 0, earned = 0;
  const used = new Set(), usedTF = new Set();
  app.innerHTML = bar(`${Q.e} ${Q.name}`, { back: 'quizmenu' }) + `<div class="quiz"><div class="qprog"></div><div class="qbody"></div></div>`;
  const body = $('.qbody', app), prog = $('.qprog', app);
  const drawProg = () => { prog.innerHTML = Array.from({ length: N }, (_, k) => `<span class="${k < i - 1 ? 'done' : k === i - 1 ? 'now' : ''}"></span>`).join(''); };
  const pickC = (filter = () => true) => {
    let pool = CREATURES.filter(c => !used.has(c.id) && filter(c));
    if (!pool.length) pool = CREATURES.filter(filter);
    const c = pick(pool); used.add(c.id); return c;
  };
  const finish = () => {
    S.stats.rounds++; save(); checkBadges();
    const msg = earned ? `Round complete! You earned ${earned} ${earned === 1 ? 'star' : 'stars'}!` : 'Round complete! Great try. Every question helps you learn!';
    body.innerHTML = `<div class="qdone"><div class="bigstar">⭐</div><h2>${msg} ${spk(msg)}</h2>
      <div class="qdone-btns"><button class="pill again">🔁 Play again</button><button class="pill" data-go="quizmenu">🎲 Other games</button><button class="pill" data-go="home">🏠 Home</button></div></div>`;
    prog.innerHTML = '';
    Sfx.play('good'); burst(body, ['⭐', '🎉', '✨'], 10);
    $('.again', body).onclick = () => go('quiz', type);
  };
  const next = () => {
    Speech.stop();
    if (i >= N) return finish();
    i++; drawProg();
    const t = type === 'mix' ? pick(['who', 'food', 'when', 'size', 'tf']) : type;
    GEN[t]();
    $('.quiz', app).scrollTop = 0;
  };
  const reward = (stars) => { if (stars) { earned += stars; S.stats.correct++; giveStars(stars); } else save(); };
  const feedback = (ok, msg) => {
    const fb = $('.qfb', body);
    fb.className = 'qfb ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = `<p>${esc(msg)}</p>${spk(msg)}${ok ? `<button class="pill next">${i >= N ? 'Finish ⭐' : 'Next ➜'}</button>` : ''}`;
    if (ok) { $('.next', fb).onclick = next; fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  };
  const cardHtml = c => `<div class="qpic">${Art.svg(c).html}</div><b>${esc(nm(c))}</b>`;

  const GEN = {
    who() {
      const target = pickC();
      const opts = shuffle([target, ...shuffle(CREATURES.filter(c => c !== target)).slice(0, 3)]);
      const clues = [`I lived in the ${ERAS[target.era].name} period.`, `I was a ${DIETS[target.diet].word}, and I was found in ${noFlags(target.where)}.`, target.clue];
      let shown = 1, done = false;
      body.innerHTML = `<h2 class="qq">Who am I? ${spk('Who am I? Read the clue, then tap the creature you think it is.')}</h2>
        <ol class="clues"></ol><button class="pill more">🔍 Another clue</button>
        <div class="opts four">${opts.map(c => `<button class="opt" data-id="${c.id}">${cardHtml(c)}</button>`).join('')}</div><div class="qfb"></div>`;
      const drawClues = () => {
        $('.clues', body).innerHTML = clues.slice(0, shown).map(t => `<li>${spk(t)}<span>${esc(t)}</span></li>`).join('');
        $('.more', body).style.visibility = shown < 3 && !done ? 'visible' : 'hidden';
      };
      drawClues();
      $('.more', body).onclick = () => { if (shown < 3) { shown++; drawClues(); Sfx.play('pop'); } };
      $$('.opt', body).forEach(b => b.onclick = () => {
        if (done) return;
        if (b.dataset.id === target.id) {
          done = true; b.classList.add('right'); Sfx.play('good'); burst(b, ['⭐', '✨'], 5);
          const stars = Math.max(1, 4 - shown);
          if (shown === 1) S.stats.detective++;
          reward(stars); drawClues();
          feedback(true, `Yes! I'm ${target.name}! ${stars === 3 ? 'You solved it from the first clue! 3 stars!' : `You get ${stars} ${stars === 1 ? 'star' : 'stars'}!`}`);
        } else {
          b.classList.add('wrong'); b.disabled = true; Sfx.play('oops');
          if (shown < 3) { shown++; drawClues(); feedback(false, "Not me! Here's another clue."); }
          else feedback(false, 'Not me! Try again.');
        }
      });
    },
    food() {
      const c = pickC();
      const right = pick(c.foods), wrongs = shuffle(Object.keys(FOODS).filter(k => !c.foods.includes(k))).slice(0, 3);
      const opts = shuffle([right, ...wrongs]);
      let tries = 0, done = false;
      const q = `What did ${nm(c)} eat?`;
      body.innerHTML = `<h2 class="qq">${esc(q)} ${spk(q)}</h2><div class="qsolo">${Art.svg(c).html}</div>
        <div class="opts four foods-q">${opts.map(k => `<button class="opt" data-k="${k}"><span class="fe">${FOODS[k].e}</span><b>${cap(FOODS[k].name)}</b></button>`).join('')}</div><div class="qfb"></div>`;
      $$('.opt', body).forEach(b => b.onclick = () => {
        if (done) return; tries++;
        if (b.dataset.k === right) { done = true; b.classList.add('right'); Sfx.play('good'); reward(tries === 1 ? 1 : 0); feedback(true, `Yes! ${c.eat}`); }
        else { b.classList.add('wrong'); b.disabled = true; Sfx.play('oops'); feedback(false, `Not that one! ${nm(c)} was a ${DIETS[c.diet].word}. Try again!`); }
      });
    },
    when() {
      const c = pickC();
      let tries = 0, done = false;
      const q = `When did ${nm(c)} live?`;
      body.innerHTML = `<h2 class="qq">${esc(q)} ${spk(q)}</h2><div class="qsolo">${Art.svg(c).html}</div>
        <div class="opts three">${Object.entries(ERAS).map(([k, e]) => `<button class="opt era-opt e-${k}" data-k="${k}"><span class="fe">${e.emoji}</span><b>${e.name}</b><small>${e.years}</small></button>`).join('')}</div><div class="qfb"></div>`;
      $$('.opt', body).forEach(b => b.onclick = () => {
        if (done) return; tries++;
        if (b.dataset.k === c.era) { done = true; b.classList.add('right'); Sfx.play('good'); reward(tries === 1 ? 1 : 0); feedback(true, `Yes! ${nm(c)} lived in the ${ERAS[c.era].name}, about ${c.mya} million years ago.`); }
        else { b.classList.add('wrong'); b.disabled = true; Sfx.play('oops'); feedback(false, 'Not quite! Try another time.'); }
      });
    },
    size() {
      const pool = CREATURES.filter(c => c.kind !== 'ptero');
      let a, b2, guard = 0;
      do { a = pickC(c => c.kind !== 'ptero'); b2 = pick(pool); guard++; } while ((b2 === a || Math.max(a.len, b2.len) / Math.min(a.len, b2.len) < 1.4) && guard < 50);
      const big = a.len > b2.len ? a : b2, small = big === a ? b2 : a;
      let tries = 0, done = false;
      const q = 'Who was longer, from nose to tail?';
      body.innerHTML = `<h2 class="qq">${q} ${spk(q)}</h2>
        <div class="opts two">${shuffle([a, b2]).map(c => `<button class="opt" data-id="${c.id}">${cardHtml(c)}</button>`).join('')}</div><div class="qfb"></div>`;
      $$('.opt', body).forEach(b => b.onclick = () => {
        if (done) return; tries++;
        if (b.dataset.id === big.id) { done = true; b.classList.add('right'); Sfx.play('good'); reward(tries === 1 ? 1 : 0); feedback(true, `Yes! ${nm(big)} was about ${fmtM(big.len)} long. ${nm(small)} was about ${fmtM(small.len)} long.`); }
        else { b.classList.add('wrong'); b.disabled = true; Sfx.play('oops'); feedback(false, 'Oops, that one was smaller! Try the other one.'); }
      });
    },
    tf() {
      let pool = TRUE_FALSE.filter((_, k) => !usedTF.has(k));
      if (!pool.length) pool = TRUE_FALSE;
      const item = pick(pool); usedTF.add(TRUE_FALSE.indexOf(item));
      let tries = 0, done = false;
      body.innerHTML = `<h2 class="qq">True or false? ${spk('True or false? ' + item.q)}</h2><p class="tfq">“${esc(item.q)}”</p>
        <div class="opts two tf"><button class="opt t" data-v="1"><span class="fe">✅</span><b>True</b></button><button class="opt f" data-v="0"><span class="fe">❌</span><b>False</b></button></div><div class="qfb"></div>`;
      $$('.opt', body).forEach(b => b.onclick = () => {
        if (done) return; tries++;
        if ((b.dataset.v === '1') === item.a) { done = true; b.classList.add('right'); Sfx.play('good'); reward(tries === 1 ? 1 : 0); feedback(true, item.why); }
        else { b.classList.add('wrong'); b.disabled = true; Sfx.play('oops'); feedback(false, 'Hmm, not quite. Try the other one!'); }
      });
    }
  };
  next();
};

function photoKeys(id) {
  const pre = PHOTO_KEY + (id === 'main' ? '' : id + '.'), out = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(pre) && (id !== 'main' || BY_ID[k.slice(pre.length)])) out.push(k);
  }
  return out;
}
function switchPlayer(id) {
  saveNow(); P.cur = id; savePlayers(); S = load(id);
  $('#modal-root').innerHTML = ''; Sfx.play('good'); Music.sync(); go('home');
}
function startOver(id) {
  const old = id === P.cur ? S : load(id);
  try { localStorage.setItem(UNDO(id), JSON.stringify(old)); } catch (e) { /* no room for the undo copy */ }
  photoKeys(id).forEach(k => localStorage.removeItem(k));
  const fresh = DEFAULT(); fresh.name = old.name; fresh.settings = old.settings;
  if (id === P.cur) { S = fresh; saveNow(); } else localStorage.setItem(saveKey(id), JSON.stringify(fresh));
}

function grownUpGate(then) {
  const a = 3 + Math.floor(Math.random() * 6), b = 4 + Math.floor(Math.random() * 6);
  // its own number pad, so it works in full screen too (Safari hides the iPad keyboard in full screen)
  const m = modal(`<div class="gate"><h2>🔒 For grown-ups</h2><p>What is ${a} × ${b}?</p><div class="gate-in gate-show"></div>
    <div class="gate-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, 'OK'].map(k => `<button class="pill gk" data-k="${k}">${k}</button>`).join('')}</div></div>`);
  let val = '';
  const show = () => { $('.gate-show', m).textContent = val || ' '; };
  const tryIt = () => { if (+val === a * b) { m.close(); then(); } else { val = ''; show(); const s = $('.sheet', m); s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); } };
  $$('.gk', m).forEach(b => b.onclick = () => { const k = b.dataset.k; if (k === 'OK') tryIt(); else if (k === '⌫') val = val.slice(0, -1); else if (val.length < 3) val += k; show(); });
  const onKey = e => { if (!document.body.contains(m)) return document.removeEventListener('keydown', onKey); if (/^\d$/.test(e.key) && val.length < 3) val += e.key; else if (e.key === 'Backspace') val = val.slice(0, -1); else if (e.key === 'Enter') return tryIt(); show(); };
  document.addEventListener('keydown', onKey); show();
}

async function exportSave() {
  saveNow();
  const data = JSON.stringify(S, null, 1);
  const who = (S.name || 'Explorer').replace(/[^A-Za-z0-9]+/g, '');
  const name = `Dino-Explorer-${who}-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([data], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Dino Explorer save' }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast('📤 Backup file saved to Downloads.');
}

function importText(text) {
  let obj = null;
  try {
    if (text.startsWith('DINO1:')) obj = JSON.parse(decodeURIComponent(escape(atob(text.slice(6)))));
    else obj = JSON.parse(text);
  } catch (e) { obj = null; }
  if (!obj || obj.v !== 1 || typeof obj.found !== 'object') { alert('Sorry, that does not look like a Dino Explorer save.'); return; }
  const n = Object.keys(obj.found || {}).length, p = (obj.park || []).length;
  const when = obj.updated ? new Date(obj.updated).toLocaleString() : 'unknown';
  if (!confirm(`Load progress for ${obj.name || 'Explorer'}?\n\n${n} creatures found, ${p} in the park, ${obj.stars} stars.\nSaved: ${when}\n\nThis replaces ${S.name || 'this player'}'s progress on this device.`)) return;
  S = normalise(obj); saveNow();
  $('#modal-root').innerHTML = '';
  toast('✅ Progress loaded!');
  go('home');
}

  hasMovie: c => HAS_MOVIE(c),
  movieRoar: c => { Sfx.movieRoar(c); return 4.8; },
  movieWhy: () => MOVIE_WHY,
  music: Music,
  voiceOf: c => Sfx.voiceOf(c),
  stars: n => giveStars(n),
  getFlag: k => !!(S.flags && S.flags[k]),
  getSetting: k => !!S.settings[k],
  park: parkApi,
  celebrate(title, text) {
    Sfx.play('good');
    const m = modal(`<div class="celebrate"><div class="confetti">🎉🦖🎉</div><h2>${esc(title)} ${spk(title + ' ' + text)}</h2><p>${esc(text)}</p><button class="pill ok-btn">Hooray!</button></div>`);
    burst($('.sheet', m), ['🎉', '⭐', '✨', '🦕'], 14);
    $('.ok-btn', m).onclick = m.close;
  },
  setFlag: k => { S.flags = S.flags || {}; S.flags[k] = 1; save(); },
  discover(id, o = {}) {
    const c = BY_ID[id]; if (!c) return;
    if (o.photo) { try { localStorage.setItem(photoKey(id), o.photo); } catch (e) { /* storage full */ } }
    const isNew = !S.found[id];
    if (isNew) { S.found[id] = Date.now(); S.stars += 1; save(); updateStars(); checkBadges(); }
    factCard(c, { isNew, photo: o.photo, onClose: o.onClose });
  }
};

function swAsk(msg) {
  return new Promise(res => {
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller; if (!sw) return res(null);
    const ch = new MessageChannel(); let first = true;

    sw.postMessage(msg, [ch.port2]);
  });
}
let offlineState = null;
const SW_OK = location.protocol === 'https:' || /[?&]swtest\b/.test(location.search);   // swtest: local testing only
if ('serviceWorker' in navigator && SW_OK) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.ready.then(() => setTimeout(() => { if (navigator.onLine) swAsk('saveAll'); }, 8000));
}
go('home');
})();
