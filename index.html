<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dino Explorer">
<meta name="theme-color" content="#bfe7ff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dino Explorer</title>
<style>
:root{--ink:#2b2a33;--card:#fffdf7;--orange:#ff8a3d;--green:#3aa76d;--blue:#3b8fd9;--purple:#8a6bd1;
  font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#fdf6e3;color:var(--ink);-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;font-size:18px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
h2{margin:.3em 0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- common ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:5;flex:none}
.bar h1{flex:1;font-size:clamp(20px,4vw,30px);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-round{width:50px;height:50px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.14);font-size:24px;display:grid;place-items:center;flex:none}
.btn-round:active,.big:active,.pill:active,.portal:active,.qcard:active,.opt:active,.cbtn:active,.food:active,.bcard:active{transform:translateY(3px);box-shadow:none}
.starbox{background:#fff4c2;border-radius:999px;padding:7px 14px;font-weight:800;font-size:20px;box-shadow:0 3px 0 #e8c95a;flex:none;white-space:nowrap}
.starbox.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25)}}
.spk{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#e4f1ff;box-shadow:0 3px 0 #b6d5f3;font-size:20px;vertical-align:middle;flex:none;line-height:1}
.spk.talking{background:#ffe08a;box-shadow:0 3px 0 #e6bd45;animation:pulse .9s infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.pill{background:#fff;border-radius:999px;padding:11px 20px;font-weight:800;font-size:18px;box-shadow:0 3px 0 rgba(0,0,0,.14);line-height:1.2}
.pill.small{padding:6px 12px;font-size:15px}
.pill:disabled{opacity:.8}
.hidden{display:none!important}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-150%);background:#fff;border-radius:22px;padding:12px 20px;font-size:18px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.2);z-index:100;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:92vw;text-align:center}
.toast.in{transform:translate(-50%,0)}
.toast .big-e{font-size:28px;vertical-align:middle}
.particle{position:absolute;font-size:26px;pointer-events:none;animation:floatup 1.4s ease-out forwards;z-index:3000}
@keyframes floatup{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-110px) scale(1.2)}}
.hop{animation:hop .6s}
@keyframes hop{30%{transform:translateY(-14%)}60%{transform:translateY(0)}80%{transform:translateY(-4%)}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(30,30,50,.45);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);z-index:50;opacity:0;transition:opacity .2s}
.modal.open{opacity:1}
.sheet{position:relative;background:var(--card);border-radius:28px;max-width:640px;width:100%;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 20px 26px;box-shadow:0 20px 60px rgba(0,0,0,.3);transform:translateY(30px) scale(.97);transition:transform .25s;text-align:center}
.modal.open .sheet{transform:none}
.sheet.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.x-close{position:absolute;right:12px;top:12px;width:46px;height:46px;border-radius:50%;background:#f1ece0;font-size:20px;z-index:2}
.sheet h2{font-size:26px;padding:0 44px}
.sheet p{font-size:19px;line-height:1.45}
.sheet input:not([type=checkbox]){display:block;margin-left:auto!important;margin-right:auto!important;width:100%;max-width:360px;padding:12px 16px;border-radius:16px;border:3px solid #e6dcc4;font-size:22px;text-align:center;margin:6px 0 14px;background:#fff}
.go-btn,.ok-btn{background:var(--green);color:#fff;font-size:22px;padding:14px 28px;box-shadow:0 4px 0 #27784d}

.welcome .wel-pic,.namebaby .nb-pic{width:62%;max-width:280px;margin:0 auto;animation:hop 2s infinite}
.welcome svg,.namebaby svg{width:100%;height:auto}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 16px}
.confetti{font-size:48px;animation:hop 1s infinite}

/* ---------- home ---------- */
.scr-home{background:linear-gradient(#bfe7ff,#fdf6e3 55%,#ecdcb6)}
.home{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 18px 30px;text-align:center;position:relative}
.gear{position:absolute;left:14px;top:14px}
.who{position:absolute;left:74px;top:14px}
.fsb{position:absolute;left:134px;top:14px}
.players h2{margin-bottom:10px}.pl-list{display:flex;flex-direction:column;gap:10px;margin:8px 0 14px}
.pl-row{display:flex;gap:8px;align-items:stretch}
.pl-pick{flex:1;text-align:left;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 3px 0 rgba(0,0,0,.14);display:flex;flex-direction:column;gap:2px;font-size:20px}
.pl-pick small{font-size:14px;opacity:.7}.pl-row.cur .pl-pick{outline:3px solid #7bc96f}
.pl-reset{width:56px;border-radius:18px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.14);font-size:24px}
.pl-pick:active,.pl-reset:active{transform:translateY(3px);box-shadow:none}
.starbox.top{position:absolute;right:14px;top:18px}
.title{font-size:clamp(40px,9vw,76px);margin:34px 0 0;color:#2e7d5b;text-shadow:0 4px 0 #fff,0 7px 0 rgba(0,0,0,.08);letter-spacing:1px;line-height:1.05}
.hello{font-size:26px;margin:8px 0 2px;font-weight:800}
.rank{margin:2px;font-size:18px;opacity:.8;font-weight:600}
.hero{display:flex;justify-content:center;align-items:flex-end;max-width:680px;margin:0 auto 12px;height:clamp(130px,min(30vh,48vw),330px)}
.hero-dino{height:100%;display:flex;align-items:flex-end}
.hero-dino svg{height:100%;width:auto;max-width:100%}
.h-trex{height:62%;margin:0 -6px}.h-triceratops{height:52%}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:760px;margin:0 auto}
.big{border-radius:28px;padding:16px 10px;font-size:clamp(20px,3.6vw,28px);font-weight:800;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.2);text-shadow:0 2px 0 rgba(0,0,0,.15)}
.big span{font-size:clamp(38px,7vw,58px);text-shadow:none}
.big small{font-size:15px;font-weight:700;opacity:.92}
.b-time{background:var(--orange)}.b-park{background:var(--green)}.b-quiz{background:var(--purple)}.b-book{background:var(--blue)}

/* ---------- time machine ---------- */
.scr-timemachine{background:linear-gradient(#3b2a6b,#6b4fb0 60%,#a98be0)}
.tm{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;color:#fff;text-align:center}
.lead{font-size:24px;font-weight:800;margin:6px 0 16px}
.portals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:900px;margin:0 auto}
.portal{border-radius:30px;padding:20px 8px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 0 0 5px rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.portal .pe{font-size:56px;animation:hop 3s infinite;text-shadow:none}
.portal b{font-size:clamp(20px,3.5vw,28px)}
.portal small{font-size:14px;font-weight:700;opacity:.9}
.portal em{font-style:normal;background:rgba(255,255,255,.3);border-radius:999px;padding:4px 12px;font-weight:800;margin-top:6px;font-size:15px}
.p-triassic{background:linear-gradient(160deg,#f2a15c,#d4623a)}
.p-jurassic{background:linear-gradient(160deg,#5cc27a,#2e8b57)}
.p-cretaceous{background:linear-gradient(160deg,#a58ae8,#6c4bc4)}
.timeline-wrap{max-width:900px;margin:28px auto 10px;background:rgba(255,255,255,.14);border-radius:24px;padding:14px 16px 12px}
.timeline-wrap h3{margin:0 0 10px;font-size:21px}
.timeline{display:flex;height:40px;border-radius:12px;overflow:hidden;font-weight:800;font-size:13px}
.seg{display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.s-triassic{background:#e8894a}.s-jurassic{background:#4caf6a}.s-cretaceous{background:#8a6bd1;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}.s-after{background:#5a6a80;font-size:12px}
.tl-marks{position:relative;height:58px}
.tl-marks span{position:absolute;transform:translateX(-50%);font-size:13px;font-weight:700;line-height:1.1;top:4px}
.tl-years{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.travel{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:26px;text-align:center;background:radial-gradient(circle,#8a6bd1,#2a1b52);opacity:0;transition:opacity .4s}
.travel.in{opacity:1}.travel.out{opacity:0}
.travel .swirl{font-size:110px;animation:spin 1s linear infinite}
.travel small{font-size:18px;opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- scenes ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:rgba(255,255,255,.7);flex:none;font-size:19px;font-weight:700;z-index:4}
.hud .pill{font-size:16px;padding:8px 14px}
.scroller{flex:1;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;position:relative;min-height:0}
.scene{position:relative;overflow:hidden}
.sky{position:absolute;inset:0;background:linear-gradient(var(--sky1),var(--sky2))}
.sun{position:absolute;top:6%;right:6%;width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff7cc,#ffd95e);box-shadow:0 0 50px #ffe58a}
.cloud{position:absolute;opacity:.9;pointer-events:none;animation:drift 30s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
.hills{position:absolute;left:0;width:100%}
.smoke{position:absolute;transform:translate(-50%,0);animation:smoke 4s ease-in-out infinite;opacity:.8}
@keyframes smoke{50%{transform:translate(-40%,-12px) scale(1.2);opacity:.5}}
.ground{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(var(--g1),var(--g2))}
.sea{position:absolute;right:0;bottom:0;background:linear-gradient(#63c7ea,#2479b3);border-top-left-radius:80px 40px}
.sea .waves{position:absolute;left:0;right:0;top:-6px;height:16px;background:radial-gradient(circle at 10px -2px,transparent 10px,#8fdcf4 11px) repeat-x;background-size:24px 16px;opacity:.8}
.plant,.decor{position:absolute;line-height:1;transform:translateX(-50%);pointer-events:none}
.layer{position:absolute;inset:0}
.actor{position:absolute;left:0;bottom:0;will-change:transform}
.actor svg{width:100%;height:auto;display:block;overflow:visible}
.flip{transition:transform .3s}
.bob{transform-origin:50% 100%;animation:breathe 3s infinite ease-in-out}
.walking .bob{animation:walk .45s infinite alternate ease-in-out}
@keyframes breathe{50%{transform:scaleY(1.025)}}
@keyframes walk{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-4%) rotate(1.5deg)}}
.k-ptero .bob,.k-ptero.walking .bob{animation:fly 2.4s infinite ease-in-out}
@keyframes fly{50%{transform:translateY(-14px)}}
.k-sea .bob,.k-sea.walking .bob{animation:swim 3s infinite ease-in-out}
@keyframes swim{50%{transform:translateY(-6px) rotate(-2deg)}}
.wingL,.wingR{transform-box:fill-box;animation:flap 1.1s infinite ease-in-out}
.wingL{transform-origin:100% 90%}.wingR{transform-origin:0% 90%}
@keyframes flap{50%{transform:scaleY(.55)}}
.actor.hop .bob{animation:hop .6s}
.qmark{position:absolute;left:50%;top:-38px;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:grid;place-items:center;font-weight:900;font-size:20px;color:var(--purple);animation:qfloat 1.6s infinite ease-in-out;pointer-events:none}
@keyframes qfloat{50%{margin-top:-6px}}
.glow svg{filter:drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #ffd54a)}
.tag{position:absolute;left:50%;top:100%;transform:translateX(-50%);background:rgba(255,255,255,.92);padding:1px 9px;border-radius:10px;font-size:14px;font-weight:800;white-space:nowrap;pointer-events:none;margin-top:2px}
.tag:empty{display:none}

/* ---------- park ---------- */
.nest{position:absolute;z-index:990;display:flex;flex-direction:column;align-items:center;min-width:calc(150px * var(--k))}
.eggs{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(4px * var(--k));position:relative;z-index:2;padding:0 10px}
.egg{width:calc(48px * var(--k));height:calc(60px * var(--k));filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.egg svg{width:100%;height:100%}
.egg.wobble{animation:wobble .5s}
@keyframes wobble{20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-7deg)}80%{transform:rotate(4deg)}}
.straw{width:100%;height:calc(34px * var(--k));margin-top:calc(-22px * var(--k));border-radius:50%;background:repeating-linear-gradient(60deg,#c79a4a 0 6px,#e0b866 6px 12px);box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.nest-label{background:rgba(255,255,255,.92);border-radius:12px;padding:3px 10px;font-weight:800;font-size:14px;margin-bottom:6px;white-space:nowrap}
.empty-park{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);background:rgba(255,255,255,.95);border-radius:26px;padding:18px 22px;max-width:min(520px,90vw);text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.2);z-index:10}
.empty-park p{font-size:20px;font-weight:700;margin:0 0 12px}
.deco-bar{flex:none;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 14px rgba(0,0,0,.1);z-index:6}
.deco-help{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
.deco-help .spk{width:34px;height:34px;font-size:16px}
.deco-items{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:4px 2px 6px}
.deco-item{flex:none;width:64px;border-radius:16px;background:#f5f0e2;display:flex;flex-direction:column;align-items:center;padding:6px 0;box-shadow:0 3px 0 #ddd3b8}
.deco-item span{font-size:32px}.deco-item small{font-weight:800;font-size:13px}
.deco-item.sel{background:#ffe08a;box-shadow:0 0 0 3px #f0a500}
.deco-item.poor{opacity:.45}
.decorating .scene{cursor:crosshair}
.decorating .decor{pointer-events:auto;outline:2px dashed rgba(255,255,255,.8);border-radius:10px}

/* ---------- cards ---------- */
.card-pic{position:relative;border-radius:22px;padding:18px 10px 8px;margin:4px 0 6px;display:flex;justify-content:center;align-items:flex-end;height:210px}
.card-pic svg{height:100%;width:auto;max-width:92%}
.card-pic .real-pic{height:112%;width:auto;max-width:100%;object-fit:contain;margin-bottom:-6px;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.readmore{display:block;text-align:center;text-decoration:none;margin:12px auto 0;background:#e8f1ff;color:#1d3f7a}
.c-triassic .card-pic,.bcard.c-triassic{background:linear-gradient(#ffe2bd,#f3c38e)}
.c-jurassic .card-pic,.bcard.c-jurassic{background:linear-gradient(#d8f5d6,#a9dca4)}
.c-cretaceous .card-pic,.bcard.c-cretaceous{background:linear-gradient(#e8defc,#c9b8f0)}
.fav{position:absolute;top:8px;left:12px;font-size:22px}
.newbadge{display:inline-block;background:#ffe08a;border-radius:999px;padding:6px 16px;font-weight:800;font-size:18px;animation:bump 1s 2}
.pron{font-size:20px!important}
.pron .spk.slow{background:#e6f7df;box-shadow:0 3px 0 #b8dfa8}
.note{background:#fff1d6;border-radius:16px;padding:10px 14px;font-weight:700}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.chip{background:#fff;border-radius:18px;padding:10px;box-shadow:0 3px 0 rgba(0,0,0,.08),0 0 0 2px #efe7d3;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:17px;line-height:1.25}
.chip span{font-size:28px}.chip small{font-size:14px;opacity:.75;font-weight:600}
.chip.wide{grid-column:1/-1}
.chip.talking{background:#fff5cc}
.readall{background:var(--blue);color:#fff;box-shadow:0 4px 0 #2a6aa6;font-size:20px}
.readall.talking{background:#f0a500}
.sheet h3{font-size:22px;margin:18px 0 8px}
.facts{list-style:none;padding:0;margin:0;text-align:left}
.facts li{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:18px;padding:10px 12px;margin-bottom:8px;font-size:19px;line-height:1.4;box-shadow:0 0 0 2px #efe7d3}
.card-actions{margin-top:14px}
.card-actions .take{background:var(--green);color:#fff;font-size:21px;padding:14px 24px;box-shadow:0 4px 0 #27784d}
.card-actions .info{background:#e9f7ee;border-radius:16px;padding:10px 14px;font-weight:700}
.era-intro .ei-emoji,.didyou .dy-e{font-size:70px}
.era-intro .years{font-weight:800;color:var(--purple)}
.era-intro .tip{background:#fff5d6;border-radius:14px;padding:8px}

/* ---------- care ---------- */
.care-pic{height:200px;display:flex;justify-content:center;align-items:flex-end;position:relative;background:linear-gradient(#cdefff,#bfe6a8);border-radius:22px;padding:14px 10px 10px;overflow:hidden}
.care-pic svg{height:100%;width:auto;max-width:92%;transition:transform .8s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%}
.care-pic.baby svg{transform:scale(.72)}
.care-pic.grown svg{transform:scale(1)}
.care-pic.ball::after{content:'⚽';position:absolute;font-size:40px;left:10%;bottom:10px;animation:ball 1.2s ease-out}
@keyframes ball{0%{left:5%;bottom:10px}25%{bottom:120px}50%{left:50%;bottom:10px}75%{bottom:70px}100%{left:85%;bottom:10px}}
.care h2 small{font-size:18px;opacity:.7}
.hearts{font-size:26px;letter-spacing:2px}
.hearts span{font-size:16px;font-weight:800;background:#fff0f3;border-radius:999px;padding:3px 10px;letter-spacing:0;vertical-align:middle}
.care-msg{display:flex;align-items:center;gap:10px;justify-content:center;min-height:54px}
.care-msg p{margin:6px 0;font-weight:700}
.care-btns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.cbtn{background:#fff;border-radius:18px;padding:10px 2px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #e0d6bd,0 0 0 2px #efe7d3;display:flex;flex-direction:column;align-items:center}
.cbtn span{font-size:34px}
.foods{margin-top:12px;background:#fff8e6;border-radius:20px;padding:10px}
.fq{font-weight:800;margin:4px 0 10px}
.food-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.food{background:#fff;border-radius:16px;padding:8px 4px;font-weight:700;font-size:15px;box-shadow:0 3px 0 #e0d6bd;display:flex;flex-direction:column;align-items:center;gap:2px}
.food span{font-size:34px}
.food.nope{opacity:.35}

/* ---------- quiz ---------- */
.scr-quizmenu,.scr-quiz{background:linear-gradient(#efe6ff,#fdf6e3)}
.qmenu,.quiz{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;text-align:center}
.qmenu .lead{color:var(--ink)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;max-width:880px;margin:0 auto}

        s += `<g fill="${IVORY}"><circle cx="${r1(x + lw * 2)}" cy="${r1(-lw * 0.3)}" r="${r1(lw * 0.2)}"/></g>`;
        if (has('sickle') && !lg.far) s += `<path d="M${r1(x + lw * 0.8)} ${r1(-lw * 0.6)}Q${r1(x + lw * 1.4)} ${r1(-lw * 2.4)} ${r1(x + lw * 2.2)} ${r1(-lw * 1.6)}Q${r1(x + lw * 1.5)} ${r1(-lw * 1.5)} ${r1(x + lw * 1.3)} ${r1(-lw * 0.5)}Z" fill="${IVORY_D}"/>`;
        if (has('legfeathers')) s += `<path d="M${r1(x)} ${r1(y0 + bh * 0.3)}l${r1(-lw * 4)} ${r1(lw * 2.5)}l${r1(lw * 1.2)} ${r1(-lw * 0.2)}l${r1(-lw * 2.4)} ${r1(lw * 2.4)}l${r1(lw * 4.5)} ${r1(-lw * 2.4)}Z" fill="${lg.far ? shade(c.acc, -0.3) : c.acc}"/>`;
        pt(x + lw * 2.4, 0);
      } else {
        s += `<rect x="${r1(x - w / 2)}" y="${r1(y0)}" width="${r1(w)}" height="${r1(-y0)}" rx="${r1(w * 0.35)}" fill="${col}"/>`;
        s += `<ellipse cx="${r1(x + w * 0.1)}" cy="${r1(-w * 0.18)}" rx="${r1(w * 0.62)}" ry="${r1(w * 0.28)}" fill="${col}"/>`;
        if (!lg.far) s += `<g fill="${IVORY}"><circle cx="${r1(x - w * 0.22)}" cy="${r1(-w * 0.12)}" r="${r1(w * 0.12)}"/><circle cx="${r1(x + w * 0.08)}" cy="${r1(-w * 0.1)}" r="${r1(w * 0.12)}"/><circle cx="${r1(x + w * 0.38)}" cy="${r1(-w * 0.12)}" r="${r1(w * 0.12)}"/></g>`;
        pt(x - w, 0); pt(x + w, 0);
      }
      return s;
    };
    out += legs.filter(l => l.far).map(legSvg).join('');

    // ----- arms far (biped) -----
    const shoulder = rot(bw * 0.62, by + bh * 0.25);
    const armSvg = (far) => {
      if (!biped || !L.arms) return '';
      const col = far ? c.far : c.col, k = bh / 14, sx = shoulder.x - (far ? 3 : 0), sy = shoulder.y + (far ? -1 : 0);
      const stroke = (d, w) => `<path d="${d}" stroke="${col}" stroke-width="${r1(w)}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
      let s = '';
      switch (L.arms) {
        case 'tiny': s = stroke(`M${r1(sx)} ${r1(sy)}q${r1(4 * k)} ${r1(3 * k)} ${r1(7 * k)} ${r1(2 * k)}`, 3.2 * k); pt(sx + 9 * k, sy + 4 * k); break;
        case 'small': s = stroke(`M${r1(sx)} ${r1(sy)}q${r1(5 * k)} ${r1(6 * k)} ${r1(11 * k)} ${r1(6 * k)}`, 3.4 * k) + `<path d="M${r1(sx + 11 * k)} ${r1(sy + 6 * k)}l${r1(2.5 * k)} ${r1(1.8 * k)}" stroke="${IVORY}" stroke-width="${r1(1.2 * k)}" stroke-linecap="round"/>`; pt(sx + 14 * k, sy + 8 * k); break;
        case 'thumb': s = stroke(`M${r1(sx)} ${r1(sy)}q${r1(6 * k)} ${r1(8 * k)} ${r1(13 * k)} ${r1(8 * k)}`, 4 * k) + `<path d="M${r1(sx + 12 * k)} ${r1(sy + 6 * k)}l${r1(1 * k)} ${r1(-6 * k)}l${r1(2.5 * k)} ${r1(5 * k)}Z" fill="${IVORY}"/>`; pt(sx + 16 * k, sy + 10 * k); break;
        case 'claws': {
          s = stroke(`M${r1(sx)} ${r1(sy)}q${r1(8 * k)} ${r1(10 * k)} ${r1(16 * k)} ${r1(14 * k)}`, 4.5 * k);
          const hx = sx + 16 * k, hy = sy + 14 * k;
          for (let i = 0; i < 3; i++) s += `<path d="M${r1(hx)} ${r1(hy)}q${r1((6 + i * 2) * k)} ${r1((6 - i) * k)} ${r1((9 + i * 3) * k)} ${r1((14 - i * 2) * k)}" stroke="${far ? IVORY_D : IVORY}" stroke-width="${r1(1.6 * k)}" fill="none" stroke-linecap="round"/>`;
          pt(hx + 16 * k, hy + 16 * k); break;
        }
        case 'wings': {
          const fc = far ? shade(c.acc, -0.3) : c.acc;
          s = `<path d="M${r1(sx)} ${r1(sy)}q${r1(8 * k)} ${r1(4 * k)} ${r1(14 * k)} ${r1(2 * k)}l${r1(-2 * k)} ${r1(8 * k)}l${r1(-5 * k)} ${r1(-2 * k)}l${r1(-3 * k)} ${r1(7 * k)}l${r1(-4 * k)} ${r1(-3 * k)}l${r1(-3 * k)} ${r1(5 * k)}Z" fill="${fc}"/>` + stroke(`M${r1(sx)} ${r1(sy)}q${r1(8 * k)} ${r1(4 * k)} ${r1(14 * k)} ${r1(2 * k)}`, 2.4 * k);
          pt(sx + 16 * k, sy + 14 * k); break;
        }
      }
      return s;
    };
    out += armSvg(true);

    // ----- tail -----
    const T1 = rot(-bw * 0.6, by - bh * 0.62), T2 = rot(-bw * 0.72, by + bh * 0.45);
    const tl = L.tail.len, tip = { x: T1.x - tl, y: by + (L.tail.up || 0) };
    const tw = bh * 0.3;
    const c1 = { x: (T1.x + tip.x) / 2, y: (T1.y + tip.y) / 2 - tw * 0.6 };
    const c2 = { x: (T2.x + tip.x) / 2 + tl * 0.08, y: (T2.y + tip.y) / 2 + tw * 0.5 };
    const tailPath = `M${r1(T1.x)} ${r1(T1.y)}Q${r1(c1.x)} ${r1(c1.y)} ${r1(tip.x)} ${r1(tip.y)}Q${r1(c2.x)} ${r1(c2.y)} ${r1(T2.x)} ${r1(T2.y)}Z`;
    pt(tip.x - 2, tip.y); pt(T1.x, T1.y);
    // point along tail upper curve
    const tailAt = (t) => { const a = (1 - t) * (1 - t), b = 2 * t * (1 - t), d = t * t; return { x: a * T1.x + b * c1.x + d * tip.x, y: a * T1.y + b * c1.y + d * tip.y }; };
    if (has('tailfin')) {
      let d = `M${r1(T1.x)} ${r1(T1.y)}`;
      const p1 = tailAt(0.25), p2 = tailAt(0.9);
      d += `Q${r1(p1.x)} ${r1(p1.y - bh * 0.9)} ${r1(p2.x)} ${r1(p2.y - 3)}L${r1(tip.x)} ${r1(tip.y)}Q${r1(tailAt(0.6).x)} ${r1(tailAt(0.6).y + bh * 0.9)} ${r1(T2.x)} ${r1(T2.y)}Z`;
      out += `<path d="${d}" fill="${shade(c.acc, -0.1)}"/>`; pt(p1.x, p1.y - bh * 0.7); pt(tailAt(0.6).x, tailAt(0.6).y + bh * 0.8);
    }
    if (has('tailfan')) {
      const fc = c.acc;
      for (let i = -2; i <= 2; i++) {
        const ang = 180 + i * 14;
        out += `<ellipse cx="${r1(tip.x - 2)}" cy="${r1(tip.y)}" rx="${r1(bh * 1.3)}" ry="${r1(bh * 0.28)}" transform="rotate(${ang} ${r1(tip.x + bh * 0.6)} ${r1(tip.y)})" fill="${i % 2 ? shade(fc, -0.15) : fc}"/>`;
      }
      pt(tip.x - bh * 2.4, tip.y - bh * 0.8); pt(tip.x - bh * 2.4, tip.y + bh * 0.8);
    }
    out += `<path d="${tailPath}" fill="${c.col}"/>`;
    if (has('thagomizer')) {
      const pts = [0.72, 0.82, 0.9];
      pts.forEach((t, i) => {
        const p = tailAt(t);
        out += `<path d="M${r1(p.x - 3)} ${r1(p.y + 1)}L${r1(p.x - 12 - i * 2)} ${r1(p.y - 16 + i * 2)}L${r1(p.x + 3)} ${r1(p.y + 1)}Z" fill="${IVORY}"/>`;
        out += `<path d="M${r1(p.x - 3)} ${r1(p.y + 3)}L${r1(p.x - 13)} ${r1(p.y - 6 - i * 2)}L${r1(p.x + 2)} ${r1(p.y + 3)}Z" fill="${IVORY_D}"/>`;
        pt(p.x - 16, p.y - 18);
      });
    }
    if (has('club')) {
      out += `<ellipse cx="${r1(tip.x + 2)}" cy="${r1(tip.y)}" rx="9" ry="7" fill="${shade(c.col, -0.15)}"/><ellipse cx="${r1(tip.x)}" cy="${r1(tip.y - 2)}" rx="4" ry="3" fill="${c.acc}"/>`;
      pt(tip.x - 8, tip.y - 8); pt(tip.x, tip.y + 8);
    }

    // ----- neck -----
    const N0 = rot(bw * 0.7, by - bh * 0.3);
    const na = L.neck.ang * Math.PI / 180, nl = L.neck.len;
    const H = { x: N0.x + Math.cos(na) * nl, y: N0.y - Math.sin(na) * nl };
    const ux = Math.cos(na), uy = -Math.sin(na), px = -uy, py = ux;
    const wb = L.neck.w / 2 * 1.4, wh = L.neck.wh / 2;
    const neckPts = [[N0.x + px * wb, N0.y + py * wb], [H.x + px * wh, H.y + py * wh], [H.x - px * wh, H.y - py * wh], [N0.x - px * wb, N0.y - py * wb]];
    out += `<path d="M${neckPts.map(p => r1(p[0]) + ' ' + r1(p[1])).join('L')}Z" fill="${c.col}"/><circle cx="${r1(H.x)}" cy="${r1(H.y)}" r="${r1(wh)}" fill="${c.col}"/>`;
    if (L.neck.len > 40) { // neck pattern
      for (let t = 0.2; t < 0.95; t += 0.18) {
        const x = N0.x + (H.x - N0.x) * t, y = N0.y + (H.y - N0.y) * t, w = wb + (wh - wb) * t;
        if (L.pat === 'spots') out += `<circle cx="${r1(x + px * w * 0.3)}" cy="${r1(y + py * w * 0.3)}" r="${r1(w * 0.3)}" fill="${c.pat}"/>`;
        if (L.pat === 'stripes') out += `<path d="M${r1(x + px * w * 0.9)} ${r1(y + py * w * 0.9)}L${r1(x + px * w * 0.1)} ${r1(y + py * w * 0.1)}" stroke="${c.pat}" stroke-width="${r1(w * 0.35)}" stroke-linecap="round"/>`;
      }
    }

    // ----- body group (rotated) -----
    let bodyG = '';
    const topY = x => by - bh * Math.sqrt(Math.max(0, 1 - (x / bw) ** 2));
    if (has('plates') || has('kentroplates')) {
      const n = has('plates') ? 9 : 5, x0 = -bw * 0.85, x1 = has('plates') ? bw * 0.55 : bw * 0.1;
      for (let row = 0; row < 2; row++) {
        for (let i = 0; i < n; i++) {
          const t = i / (n - 1), x = x0 + (x1 - x0) * t + (row ? 5 : 0);
          const hgt = (has('plates') ? 13 : 9) + Math.sin(t * Math.PI) * (has('plates') ? 14 : 6) - (row ? 3 : 0);
          const y = topY(Math.max(-bw * 0.97, Math.min(bw * 0.97, x))) + 5, w = has('plates') ? 12 : 9;
          const col = row ? shade(c.acc, -0.25) : c.acc;
          bodyG += `<path d="M${r1(x - w / 2)} ${r1(y)}L${r1(x - w * 0.45)} ${r1(y - hgt * 0.55)}L${r1(x)} ${r1(y - hgt)}L${r1(x + w * 0.45)} ${r1(y - hgt * 0.55)}L${r1(x + w / 2)} ${r1(y)}Z" fill="${col}"/>`;
          const g = rot(x, y - hgt); pt(g.x, g.y);
        }
      }
      if (has('kentroplates')) {
        for (let i = 0; i < 4; i++) {
          const x = -bw * 0.1 - i * bw * 0.25, y = topY(Math.max(-bw * 0.97, x)) + 4;
          bodyG += `<path d="M${r1(x - 3)} ${r1(y)}L${r1(x - 2)} ${r1(y - 20)}L${r1(x + 3)} ${r1(y)}Z" fill="${c.acc}"/>`;
          const g = rot(x, y - 20); pt(g.x, g.y);
        }
      }
    }
    if (has('sail')) {
      const x0 = -bw * 0.75, x1 = bw * 0.6, Hs = bh * 2.3;
      const y0 = topY(x0) + 4, y1 = topY(x1) + 4;
      bodyG += `<path d="M${r1(x0)} ${r1(y0)}C${r1(x0 + 6)} ${r1(by - bh - Hs)} ${r1(x1 - 18)} ${r1(by - bh - Hs * 1.1)} ${r1(x1)} ${r1(y1)}Z" fill="${c.acc}"/>`;
      for (let i = 1; i < 8; i++) {
        const x = x0 + (x1 - x0) * i / 8;
        bodyG += `<path d="M${r1(x)} ${r1(topY(x) + 3)}L${r1(x - 2)} ${r1(by - bh - Hs * (0.55 + Math.sin(i / 8 * Math.PI) * 0.25))}" stroke="${shade(c.acc, -0.25)}" stroke-width="1.6" stroke-linecap="round"/>`;
      }
      const g = rot(0, by - bh - Hs * 0.85); pt(g.x, g.y);
    }
    if (has('backbumps')) {
      for (let i = 0; i < 9; i++) { const x = -bw * 0.85 + i * bw * 0.2; bodyG += `<rect x="${r1(x - 3)}" y="${r1(topY(x) - 3)}" width="6" height="6" rx="1.5" fill="${c.acc}"/>`; }
    }
    if (has('sidespike')) bodyG += `<path d="M${r1(-bw * 0.35)} ${r1(by)}L${r1(-bw * 0.9)} ${r1(by - bh * 0.9)}L${r1(-bw * 0.2)} ${r1(by - 6)}Z" fill="${c.acc}"/>`;
    // body
    bodyG += `<clipPath id="${id}b"><ellipse cx="0" cy="${r1(by)}" rx="${bw}" ry="${bh}"/></clipPath>`;
    bodyG += `<ellipse cx="0" cy="${r1(by)}" rx="${bw}" ry="${bh}" fill="${c.col}"/>`;
    let inner = `<ellipse cx="${r1(bw * 0.1)}" cy="${r1(by + bh * 0.78)}" rx="${r1(bw * 0.88)}" ry="${r1(bh * 0.48)}" fill="${c.belly}"/>`;
    const R = rng(seed);
    if (L.pat === 'spots') for (let i = 0; i < 8; i++) inner += `<circle cx="${r1((R() * 1.6 - 0.8) * bw)}" cy="${r1(by - bh * (0.2 + R() * 0.7))}" r="${r1(bh * (0.1 + R() * 0.12))}" fill="${c.pat}" opacity="0.8"/>`;
    if (L.pat === 'stripes') for (let i = 0; i < 6; i++) { const x = -bw * 0.75 + i * bw * 0.3; inner += `<path d="M${r1(x)} ${r1(by - bh)}Q${r1(x + 6)} ${r1(by - bh * 0.4)} ${r1(x - 1)} ${r1(by + bh * 0.1)}" stroke="${c.pat}" stroke-width="${r1(bh * 0.2)}" fill="none" stroke-linecap="round" opacity="0.75"/>`; }
    if (has('armor')) {
      for (let row = 0; row < 3; row++) for (let i = 0; i < 9; i++) {
        const x = -bw * 0.85 + i * bw * 0.21 + (row % 2) * bw * 0.1, y = by - bh * (0.75 - row * 0.3);
        inner += `<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(bw * 0.07)}" ry="${r1(bh * 0.1)}" fill="${c.acc}" stroke="${shade(c.col, -0.25)}" stroke-width="1"/>`;
      }
    }
    bodyG += `<g clip-path="url(#${id}b)">${inner}</g>`;
    if (has('armor')) for (let i = 0; i < 8; i++) {
      const x = -bw * 0.85 + i * bw * 0.24, y = topY(x);
      bodyG += `<path d="M${r1(x - 4)} ${r1(y + 3)}L${r1(x)} ${r1(y - 6)}L${r1(x + 4)} ${r1(y + 3)}Z" fill="${c.acc}"/>`;
    }
    if (has('armor')) for (let i = 0; i < 5; i++) {
      const x = -bw * 0.7 + i * bw * 0.35, y = by + bh * 0.45;
      bodyG += `<path d="M${r1(x - 4)} ${r1(y - 3)}L${r1(x - 1)} ${r1(y + 8)}L${r1(x + 4)} ${r1(y - 3)}Z" fill="${c.acc}"/>`;
    }
    out += `<g transform="rotate(${tiltDeg} 0 ${r1(by)})">${bodyG}</g>`;
    [[-bw, by], [bw, by], [0, by - bh], [0, by + bh]].forEach(([x, y]) => { const g = rot(x, y); pt(g.x, g.y); });

    // ----- near legs & arm -----
    out += legs.filter(l => !l.far).map(legSvg).join('');
    out += armSvg(false);

    // ----- head -----
    out += headSvg(H, L.head, feats, c, box);
    return out;
  }

  function pteroBody(L, c, id, pt, box) {
    const S = L.span, wing = L.wing || shade(c.col, -0.1);
    let out = '';
    // far wing (right, smaller)
    out += `<path class="wingR" d="M4-3Q${r1(S * 0.2)} ${r1(-S * 0.3)} ${r1(S * 0.42)} ${r1(-S * 0.16)}Q${r1(S * 0.22)} ${r1(-S * 0.04)} 6 5Z" fill="${shade(wing, -0.2)}"/>`;
    pt(S * 0.42, -S * 0.3);
    // tail
    if (L.tail === 'vane') {
      const tx = -S * 0.42, ty = 10;
      out += `<path d="M-10 2Q${r1(tx * 0.5)} 8 ${r1(tx)} ${ty}" stroke="${c.col}" stroke-width="2" fill="none"/><path d="M${r1(tx)} ${ty - 6}L${r1(tx - 7)} ${ty}L${r1(tx)} ${ty + 6}L${r1(tx + 5)} ${ty}Z" fill="${c.acc}"/>`;
      pt(tx - 8, ty + 7);
    } else out += `<path d="M-10 0L-18 3L-10 4Z" fill="${c.col}"/>`;
    // legs
    out += `<path d="M-6 5l-4 10M-2 5l-2 10" stroke="${shade(c.col, -0.3)}" stroke-width="2.2" stroke-linecap="round"/>`;
    pt(-10, 16);
    // near wing (left)
    out += `<path class="wingL" d="M-2-3Q${r1(-S * 0.25)} ${r1(-S * 0.34)} ${r1(-S * 0.55)} ${r1(-S * 0.1)}Q${r1(-S * 0.3)} ${r1(-S * 0.02)} -6 6Z" fill="${wing}"/><path d="M-2-3Q${r1(-S * 0.25)} ${r1(-S * 0.34)} ${r1(-S * 0.55)} ${r1(-S * 0.1)}" stroke="${shade(c.col, -0.35)}" stroke-width="1.6" fill="none"/>`;
    pt(-S * 0.56, -S * 0.3);
    // body
    out += `<ellipse cx="0" cy="0" rx="13" ry="7.5" fill="${c.col}"/><ellipse cx="2" cy="3" rx="10" ry="4" fill="${shade(c.col, 0.3)}"/>`;
    pt(-13, -8); pt(13, 8);
    // neck + head
    const na = 35 * Math.PI / 180, nl = L.neckLen;
    const N0 = { x: 9, y: -3 }, H = { x: N0.x + Math.cos(na) * nl, y: N0.y - Math.sin(na) * nl };
    out += `<path d="M${N0.x} ${N0.y}L${r1(H.x)} ${r1(H.y)}" stroke="${c.col}" stroke-width="5" stroke-linecap="round"/>`;
    out += headSvg(H, L.head, [], c, box);
    return out;
  }

  function seaBody(L, c, id, pt, box, seed) {
    let out = '';
    const R = rng(seed);
    if (L.form === 'plesio') {
      const fl = (x, y, rx, ry, a, col) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${a} ${x} ${y})" fill="${col}"/>`;
      out += fl(16, 6, 16, 4.5, 28, c.far) + fl(-16, 7, 13, 4, 32, c.far);
      const tl = L.tailLen;
      out += `<path d="M-24-6Q${-24 - tl * 0.6} -2 ${-24 - tl} 2Q${-24 - tl * 0.5} 6 -24 8Z" fill="${c.col}"/>`;
      pt(-24 - tl, 2);
      const na = L.neckAng * Math.PI / 180, nl = L.neckLen, N0 = { x: 24, y: -4 };
      const H = { x: N0.x + Math.cos(na) * nl, y: N0.y - Math.sin(na) * nl };
      out += `<path d="M${N0.x} ${N0.y - 5}L${r1(H.x)} ${r1(H.y - 3)}L${r1(H.x)} ${r1(H.y + 3)}L${N0.x} ${N0.y + 7}Z" fill="${c.col}"/><circle cx="${r1(H.x)}" cy="${r1(H.y)}" r="3" fill="${c.col}"/>`;
      out += `<clipPath id="${id}b"><ellipse cx="0" cy="0" rx="30" ry="14"/></clipPath><ellipse cx="0" cy="0" rx="30" ry="14" fill="${c.col}"/>`;
      let inner = `<ellipse cx="2" cy="11" rx="28" ry="8" fill="${c.belly}"/>`;
      if (L.pat === 'spots') for (let i = 0; i < 6; i++) inner += `<circle cx="${r1(R() * 44 - 22)}" cy="${r1(-R() * 10)}" r="${r1(1.5 + R() * 2)}" fill="${c.pat}"/>`;
      out += `<g clip-path="url(#${id}b)">${inner}</g>`;
      out += fl(12, 9, 17, 4.8, 30, c.col) + fl(-19, 10, 14, 4.2, 34, c.col);
      pt(-34, -14); pt(30, 20); pt(-32, 18);
      out += headSvg(H, L.head, [], c, box);
    } else if (L.form === 'ichthy') {
      const sn = 24 * (L.snout || 1);
      out += `<path d="M8 6Q2 18-6 22Q0 12 2 6Z" fill="${c.far}"/>`;
      out += `<path d="M-38 0L-60-20Q-54-2-58 17Z" fill="${c.dark}"/><path d="M-6-14Q0-31 12-13Z" fill="${c.dark}"/>`;
      out += `<clipPath id="${id}b"><path d="M-42 0Q-20-18 10-14Q26-12 34-4L${r1(34 + sn)}-1L34 3Q20 12-10 11Q-30 9-42 0Z"/></clipPath>`;
      out += `<path d="M-42 0Q-20-18 10-14Q26-12 34-4L${r1(34 + sn)}-1L34 3Q20 12-10 11Q-30 9-42 0Z" fill="${c.col}"/>`;
      let inner = `<ellipse cx="0" cy="10" rx="44" ry="7" fill="${c.belly}"/>`;
      if (L.pat === 'stripes') for (let i = 0; i < 5; i++) inner += `<path d="M${-28 + i * 12} -16L${-31 + i * 12} 2" stroke="${c.pat}" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>`;
      out += `<g clip-path="url(#${id}b)">${inner}</g>`;
      out += `<path d="M14 6Q8 18 0 21Q5 11 8 5Z" fill="${c.col}"/>`;
      out += eye(22, -5, 4.5) + `<path d="M32 1.5L${r1(30 + sn * 0.8)} 0.5" stroke="${c.line}" stroke-width="0.9"/>`;
      pt(-60, -31); pt(34 + sn, 22);
    } else { // mosa
      out += `<ellipse cx="22" cy="8" rx="11" ry="3.5" transform="rotate(30 22 8)" fill="${c.far}"/><ellipse cx="-22" cy="8" rx="10" ry="3.2" transform="rotate(30 -22 8)" fill="${c.far}"/>`;
      out += `<path d="M-40-7Q-70-5-92 0L-104-18Q-99 3-104 18L-90 6Q-66 9-40 9Z" fill="${c.col}"/>`;
      out += `<clipPath id="${id}b"><ellipse cx="0" cy="0" rx="48" ry="11"/></clipPath><ellipse cx="0" cy="0" rx="48" ry="11" fill="${c.col}"/>`;
      let inner = `<ellipse cx="0" cy="9" rx="48" ry="6" fill="${c.belly}"/>`;
      if (L.pat === 'stripes') for (let i = 0; i < 7; i++) inner += `<path d="M${-36 + i * 11} -12L${-39 + i * 11} 2" stroke="${c.pat}" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>`;
      out += `<g clip-path="url(#${id}b)">${inner}</g>`;
      out += `<ellipse cx="20" cy="10" rx="12" ry="3.8" transform="rotate(35 20 10)" fill="${c.col}"/><ellipse cx="-24" cy="10" rx="11" ry="3.5" transform="rotate(35 -24 10)" fill="${c.col}"/>`;
      pt(-104, -18); pt(-104, 18); pt(0, 16);
      out += headSvg({ x: 44, y: -2 }, { t: 'croc', s: 1.1 }, [], c, box);
    }
    return out;
  }

  function egg(cr, cracks = 0) {
    const c = colors(cr.look), R = rng(cr.id + 'egg');
    let spots = '';
    for (let i = 0; i < 6; i++) spots += `<circle cx="${r1(10 + R() * 20)}" cy="${r1(14 + R() * 26)}" r="${r1(1.5 + R() * 2.5)}" fill="${c.col}" opacity="0.75"/>`;
    const cr1 = cracks >= 1 ? `<path d="M9 22l5 3 3-4 4 4 4-3 4 3 3-2" stroke="#6b5a4a" stroke-width="1.4" fill="none" stroke-linejoin="round"/>` : '';
    const cr2 = cracks >= 2 ? `<path d="M11 32l4-3 3 3 4-3 4 3 3-2 3 2" stroke="#6b5a4a" stroke-width="1.4" fill="none" stroke-linejoin="round"/>` : '';
    return `<svg viewBox="0 0 40 50" xmlns="http://www.w3.org/2000/svg"><ellipse cx="20" cy="29" rx="15" ry="19" fill="${shade(c.col, 0.72)}"/>${spots}<ellipse cx="14" cy="20" rx="3.5" ry="6" fill="#fff" opacity="0.55"/>${cr1}${cr2}</svg>`;
  }

  return { svg, egg, shade };
})();

<script>
// ================= DINO EXPLORER — GAME =================
(() => {
'use strict';
const KEY = 'dinoExplorer.save.v1';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const nm = c => c.short || c.name;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const noFlags = s => s.replace(/[\u{1F1E6}-\u{1F1FF}]/gu, '').replace(/\s+/g, ' ').trim();
const newId = () => Math.random().toString(36).slice(2, 9);
const spk = (text, extra = '') => `<button class="spk" data-say="${esc(noFlags(text))}" ${extra} aria-label="Read aloud">🔊</button>`;

// ---------------- save ----------------
const DEFAULT = () => ({ v: 1, name: '', stars: 5, found: {}, eggs: [], park: [], decor: [], decor3d: [], fedOnce: {}, badges: {}, decorSeen: {},
  stats: { correct: 0, rounds: 0, fed: 0, detective: 0 }, eraSeen: {}, settings: { voice: '', slow: false, sound: true, autoFull: true }, created: Date.now(), updated: Date.now() });
function normalise(s) {
  const d = DEFAULT();
  return Object.assign(d, s, { settings: Object.assign(d.settings, s.settings || {}), stats: Object.assign(d.stats, s.stats || {}) });
}
// players: each has its own save; the first player keeps the original save slot
const PKEY = 'dinoExplorer.players';
function loadPlayers() {
  try { const p = JSON.parse(localStorage.getItem(PKEY)); if (p && Array.isArray(p.list) && p.list.length) return p; } catch (e) { /* first run */ }
  return { list: ['main'], cur: 'main' };
}
let P = loadPlayers();
if (!P.list.includes(P.cur)) P.cur = P.list[0];
const saveKey = id => id === 'main' ? KEY : KEY + '.' + id;
const UNDO = id => 'dinoExplorer.undo.' + id;
function savePlayers() { try { localStorage.setItem(PKEY, JSON.stringify(P)); } catch (e) { /* storage blocked */ } }
function load(id = P.cur) {
  try { const s = JSON.parse(localStorage.getItem(saveKey(id))); if (s && s.v === 1) return normalise(s); } catch (e) { /* fresh start */ }
  return DEFAULT();
}
let S = load();
let saveT = null;
function saveNow() { clearTimeout(saveT); saveT = null; try { localStorage.setItem(saveKey(P.cur), JSON.stringify(S)); } catch (e) { /* storage full or blocked */ } }
function save() { S.updated = Date.now(); clearTimeout(saveT); saveT = setTimeout(saveNow, 120); }
window.addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

const nFound = () => Object.keys(S.found).filter(id => BY_ID[id]).length;
function giveStars(n) { if (!n) return; S.stars += n; save(); updateStars(); Sfx.play('star'); }
function updateStars() { $$('.starcount').forEach(x => { x.textContent = S.stars; x.parentElement.classList.remove('bump'); void x.offsetWidth; x.parentElement.classList.add('bump'); }); }

// ---------------- full screen ----------------
// Safari on iPad can hide its bars for a web page, but only after a tap, so the game asks on her first tap
// (and again after the bars come back). Grown-ups can switch the automatic part off.
const FS = {
  can: () => { const e = document.documentElement; return !!(e.requestFullscreen || e.webkitRequestFullscreen); },
  on: () => !!(document.fullscreenElement || document.webkitFullscreenElement),
  app: () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true,
  enter() {
    const e = document.documentElement, f = e.requestFullscreen || e.webkitRequestFullscreen;
    try { const p = f.call(e, { navigationUI: 'hide' }); if (p && p.catch) p.catch(() => {}); } catch (err) { /* not allowed right now */ }
  },
  exit() { const f = document.exitFullscreen || document.webkitExitFullscreen; try { const p = f && f.call(document); if (p && p.catch) p.catch(() => {}); } catch (err) { /* ignore */ } },
  toggle() { if (FS.on()) FS.exit(); else FS.enter(); }
};
// Safari puts its own ✕ in the top-left corner in full screen, so the game moves its corner buttons aside
const fsMark = () => document.documentElement.classList.toggle('fs', FS.on());
// Safari hides the iPad keyboard in full screen: when she taps a text box, step out of full screen (her next tap after typing goes back in)
let typing = false;
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('input[type=text], input:not([type]), textarea')) { typing = true; if (FS.on()) FS.exit(); } });

document.addEventListener('fullscreenchange', fsMark); document.addEventListener('webkitfullscreenchange', fsMark);
document.addEventListener('pointerup', e => {
  if (e.target.closest && e.target.closest('.fsb')) return;
  if (typing || (e.target.matches && e.target.matches('input, textarea'))) return;
  // taps in pop-up windows and on the corner buttons don't switch full screen back on (so the keyboard can appear there)
  if (e.target.closest && e.target.closest('#modal-root, .gear, .who, .fsb')) return;
  if (S.settings.autoFull && FS.can() && !FS.on() && !FS.app()) FS.enter();
}, true);

// ---------------- speech ----------------
const Speech = {
  ok: 'speechSynthesis' in window, voices: [], btn: null,
  init() {
    if (!this.ok) return;
    const load = () => { this.voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang)); };
    load();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', load);
  },
  voice() {
    const v = this.voices;
    if (!v.length) return null;
    return v.find(x => x.voiceURI === S.settings.voice)
      || v.find(x => /en-GB/i.test(x.lang) && /enhanced|premium/i.test(x.name))
      || v.find(x => /en-US/i.test(x.lang) && /enhanced|premium/i.test(x.name))
      || v.find(x => /Samantha|Karen|Serena|Kate|Moira|Martha|Daniel/i.test(x.name))
      || v.find(x => /en-GB/i.test(x.lang)) || v[0];
  },
  say(text, btn, rate = 1) {
    if (!this.ok) { toast('This device cannot read aloud, sorry!'); return; }
    const sameBtn = btn && this.btn === btn;
    const busy = speechSynthesis.speaking || speechSynthesis.pending;
    this.stop();
    if (sameBtn && busy) return; // tapping again stops it
    const u = new SpeechSynthesisUtterance(text);
    const v = this.voice();
    if (v) { u.voice = v; u.lang = v.lang; }
    u.rate = rate * (S.settings.slow ? 0.78 : 0.92);
    u.pitch = 1.05;
    if (btn) { btn.classList.add('talking'); this.btn = btn; }
    Music.duck('speech', 0.3);
    u.onend = u.onerror = () => { if (btn) btn.classList.remove('talking'); if (this.btn === btn) this.btn = null; Music.duck('speech', 1); };
    if (busy) setTimeout(() => speechSynthesis.speak(u), 90); else speechSynthesis.speak(u);
  },
  stop() {
    if (!this.ok) return;
    speechSynthesis.cancel(); Music.duck('speech', 1);
    if (this.btn) { this.btn.classList.remove('talking'); this.btn = null; }
  }
};

// ---------------- sounds (made with Web Audio, no files) ----------------
const Sfx = {
  ctx: null,
  unlock() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }

  },
  // a small bell: a pure note with a soft metallic overtone
  bell(f, t0, dur, vol, dest) {
    const c = this.ctx, t = c.currentTime + t0;

    });
  },
  // the Time Machine trip: a soft whoosh that rises with twinkling sparkles
  travel(dur) {
    this.arrive(true);
    const c = this.ctx, t = c.currentTime, out = c.createGain(); out.connect(c.destination);
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.6, t + 0.7);
    const n = Math.floor(c.sampleRate * (dur + 0.5)), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(220, t); f.frequency.exponentialRampToValueAtTime(2600, t + dur);
    const ng = c.createGain(); ng.gain.value = 0.13;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.8; lg.gain.value = 0.07; lfo.connect(lg).connect(ng.gain);
    const hum = c.createOscillator(), hg = c.createGain(); hum.frequency.setValueAtTime(117, t); hum.frequency.exponentialRampToValueAtTime(349, t + dur); hg.gain.value = 0.045;
    src.connect(f).connect(ng).connect(out); hum.connect(hg).connect(out);
    src.start(t); lfo.start(t); hum.start(t);
    const notes = [1175, 1397, 1568, 1865, 2093, 2349, 2794, 3136];   // B-flat major, sparkly and high
    for (let s = 0.3; s < dur - 0.2; s += 0.3 - 0.16 * s / dur + Math.random() * 0.08)
      this.bell(notes[Math.floor(Math.random() * notes.length)], s, 0.7, 0.03 + 0.03 * s / dur, out);
    this.trip = { out, nodes: [src, lfo, hum] };
  },
  // one voice of a call: a buzzy tone shaped by the body (formant filters) with an optional throb
  voice(t0, dur, f0, f1, o = {}) {
    const c = this.ctx, t = c.currentTime + t0, osc = c.createOscillator(), amp = c.createGain();
    osc.type = o.type || 'sawtooth'; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    if (o.vib) { const v = c.createOscillator(), vg = c.createGain(); v.frequency.value = 5; vg.gain.value = f0 * o.vib; v.connect(vg).connect(osc.frequency); v.start(t); v.stop(t + dur + 0.1); }
    const vol = o.vol || 0.2, a = o.attack || 0.05, r = o.release || 0.2;
    amp.gain.setValueAtTime(0.0001, t); amp.gain.exponentialRampToValueAtTime(vol, t + a);
    amp.gain.setValueAtTime(vol, t + Math.max(a, dur - r)); amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = amp;
    if (o.trem) { const tg = c.createGain(), l = c.createOscillator(), lg = c.createGain(); tg.gain.value = 1 - o.trem / 2; l.frequency.value = o.tremHz || 12; lg.gain.value = o.trem / 2; l.connect(lg).connect(tg.gain); l.start(t); l.stop(t + dur + 0.1); amp.connect(tg); out = tg; }

    if (o.formants) for (const [f, q, g] of o.formants) { const b = c.createBiquadFilter(), gg = c.createGain(); b.type = 'bandpass'; b.frequency.value = f; b.Q.value = q; gg.gain.value = g * 2.5; out.connect(b).connect(gg).connect(dest); }

    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = Math.sqrt(lo * hi); f.Q.value = Math.sqrt(lo * hi) / (hi - lo);

  },

  call(c) {

          this.voice(0, 2.1, f * 2.16, f * 1.64, { type: 'triangle', cutoff: 700, vol: 0.08, attack: 0.5, release: 0.7 });
          this.breath(0.05, 2.1, 0.35, 60, 260); break; }
        case 'croc': { const f = cl(85 * k(5, 0.4), 55, 150); dur = 1.6;
          this.voice(0, 1.5, f, f * 0.9, { cutoff: 500, vol: 0.3, attack: 0.15, release: 0.4, trem: 0.9, tremHz: 22 }); this.breath(0, 1.5, 0.25, 70, 300); break; }
        case 'rumble': { const f = cl(55 * k(22, 0.35), 38, 110); dur = 3.2;
          this.voice(0, 1.7, f, f * 1.15, { cutoff: 320, vol: 0.32, attack: 0.6, release: 0.6, trem: 0.3, tremHz: 6 });
          this.voice(1.4, 1.8, f * 1.1, f * 0.8, { cutoff: 320, vol: 0.3, attack: 0.5, release: 0.8, trem: 0.3, tremHz: 5 });
          this.breath(0, 3.1, 0.2, 40, 180); break; }
        case 'bellow': { const f = cl(110 * k(8, 0.4), 70, 220); dur = 1.8;
          const fm = [[380, 4, 1], [900, 5, 0.45]];
          this.voice(0, 0.38, f * 1.1, f * 0.95, { formants: fm, vol: 0.25, attack: 0.04, release: 0.15 });
          this.voice(0.45, 0.38, f * 1.1, f * 0.95, { formants: fm, vol: 0.25, attack: 0.04, release: 0.15 });
          this.voice(0.9, 0.85, f * 1.15, f * 0.8, { formants: fm, vol: 0.28, attack: 0.06, release: 0.35 }); break; }
        case 'honk': { const f = cl(150 * k(9, 0.3), 90, 260); dur = 1.3; const fm = [[520, 5, 1], [1150, 6, 0.55]];
          this.voice(0, 0.36, f, f * 1.15, { type: 'square', formants: fm, vol: 0.16, attack: 0.03, release: 0.12 });
          this.voice(0.48, 0.7, f * 1.18, f * 0.92, { type: 'square', formants: fm, vol: 0.18, attack: 0.03, release: 0.3 }); break; }
        case 'trumpet': { const f = 92; dur = 2.6; const fm = [[280, 6, 1], [560, 7, 0.8], [860, 8, 0.45]];
          this.voice(0, 2.4, f * 0.94, f, { formants: fm, vol: 0.3, attack: 0.3, release: 0.6, vib: 0.012 });
          this.voice(0, 2.4, f * 1.88, f * 2, { type: 'sine', cutoff: 800, vol: 0.05, attack: 0.4, release: 0.6 }); break; }
        case 'coo': { const f = cl(170 * k(3, 0.3), 90, 300); dur = 1.6;
          for (let i = 0; i < 3; i++) this.voice(i * 0.5, 0.42, f, f * 0.82, { type: 'triangle', cutoff: 900, vol: 0.22, attack: 0.08, release: 0.2, trem: 0.4, tremHz: 18 }); break; }
        case 'hiss': { const f = cl(300 * k(2, 0.3), 180, 500); dur = 1.5;
          this.breath(0, 0.8, 0.5, 3000, 7000);
          this.voice(0.85, 0.3, f, f * 0.8, { type: 'triangle', cutoff: 1200, vol: 0.16, attack: 0.04, release: 0.15 });
          this.voice(1.18, 0.32, f * 0.95, f * 0.75, { type: 'triangle', cutoff: 1200, vol: 0.14, attack: 0.04, release: 0.15 }); break; }
        case 'chirp': { dur = 1.4; let t = 0;
          for (let i = 0; i < 5; i++, t += 0.1) { const f = 2300 + Math.random() * 700; this.voice(t, 0.07, f, f * 1.3, { type: 'sine', cutoff: 8000, vol: 0.1, attack: 0.01, release: 0.03 }); }
          t += 0.25; for (let i = 0; i < 3; i++, t += 0.14) { const f = 2600 + Math.random() * 600; this.voice(t, 0.1, f * 1.2, f, { type: 'sine', cutoff: 8000, vol: 0.1, attack: 0.01, release: 0.04 }); }
          this.breath(0.2, 0.3, 0.08, 3500, 7000); break; }
        case 'croak': { const f = cl(260 * k(5, 0.3), 110, 420); dur = 1.4; const fm = [[800, 3, 1], [1700, 4, 0.5]];
          this.voice(0, 0.5, f, f * 0.8, { formants: fm, vol: 0.2, attack: 0.03, release: 0.15, trem: 0.9, tremHz: 32 });
          this.voice(0.65, 0.6, f * 0.95, f * 0.72, { formants: fm, vol: 0.22, attack: 0.03, release: 0.2, trem: 0.9, tremHz: 28 }); break; }
        case 'snort': { dur = 1.8;
          this.breath(0, 0.75, 0.9, 400, 1600); this.voice(0, 0.3, cl(110 * k(8, 0.3), 60, 180), 70, { cutoff: 400, vol: 0.18, attack: 0.02, release: 0.15 });
          this.breath(0.9, 0.8, 0.45, 250, 900); break; }
      }
    } catch (e) { /* audio not available */ }
    this.callOut = null;
    Music.duck('call', 0.35); clearTimeout(this.callT); this.callT = setTimeout(() => Music.duck('call', 1), dur * 1000 + 300);
    return dur;
  },
  // the big movie-style T. rex roar (a sound file, loaded the first time it's needed)
  async movieRoar(c) {
    if (!S.settings.sound) return 0;
    this.unlock(); const x = this.ctx; if (!x) return 0;
    try {
      if (!this.movieBuf) this.movieBuf = await fetch('assets/sounds/trex_movie.m4a?v=1790901068').then(r => r.arrayBuffer()).then(a => new Promise((ok, no) => x.decodeAudioData(a, ok, no)));
      const s = x.createBufferSource(), g = x.createGain(); g.gain.value = 0.95; s.buffer = this.movieBuf; s.connect(g).connect(x.destination); s.start();
      Music.duck('call', 0.2); clearTimeout(this.callT); this.callT = setTimeout(() => Music.duck('call', 1), 6000);
      return 4.8;
    } catch (e) { this.movieBuf = null; return this.call(c); }
  },
  // arriving: the whoosh fades and a warm chime rings
  arrive(quiet) {
    const T = this.trip; this.trip = null;
    if (T) { const t = this.ctx.currentTime; T.out.gain.cancelScheduledValues(t); T.out.gain.setTargetAtTime(0.0001, t, 0.12); T.nodes.forEach(x => { try { x.stop(t + 0.8); } catch (e) { /* already stopped */ } }); }
    if (quiet) return;
    [466, 587, 698, 932, 1175].forEach((f, i) => this.bell(f, i * 0.09, 2.4, 0.07));
    this.bell(233, 0, 2.8, 0.05);
  },
  tone(f, t0, dur, type = 'sine', vol = 0.15, f2) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;

    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(t0, dur, vol = 0.2, freq = 800) {
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), b = c.createBuffer(1, n, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
    const g = c.createGain(); g.gain.value = vol;
    s.connect(f).connect(g).connect(c.destination); s.start(c.currentTime + t0);
  },
  play(name) {
    if (!S.settings.sound) return;
    this.unlock();
    if (!this.ctx) return;
    try {
      switch (name) {
        case 'pop': this.tone(600, 0, 0.12, 'sine', 0.1, 900); break;
        case 'star': [880, 1175, 1568].forEach((f, i) => this.tone(f, i * 0.07, 0.2, 'triangle', 0.09)); break;
        case 'good': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.08, 0.24, 'triangle', 0.11)); break;
        case 'oops': this.tone(330, 0, 0.18, 'sine', 0.09, 260); this.tone(260, 0.16, 0.22, 'sine', 0.09, 220); break;
        case 'crack': this.noise(0, 0.07, 0.3, 2600); this.noise(0.1, 0.05, 0.22, 2000); break;
        case 'hatch': this.noise(0, 0.1, 0.3, 2500); [523, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.15 + i * 0.09, 0.26, 'triangle', 0.11)); break;
        case 'munch': for (let i = 0; i < 3; i++) this.noise(i * 0.17, 0.09, 0.35, 900); break;
        case 'roar': this.tone(150, 0, 0.75, 'sawtooth', 0.1, 70); this.noise(0, 0.7, 0.12, 500); break;
        case 'honk': this.tone(220, 0, 0.45, 'square', 0.05, 196); this.tone(330, 0, 0.45, 'sine', 0.06, 294); break;
        case 'chirp': this.tone(1400, 0, 0.08, 'sine', 0.09, 1900); this.tone(1500, 0.12, 0.08, 'sine', 0.09, 2100); break;
        case 'splash': this.noise(0, 0.45, 0.25, 1200); break;
        case 'whoosh': this.noise(0, 1.1, 0.14, 700); this.tone(200, 0, 1.1, 'sine', 0.05, 900); break;
        case 'boing': this.tone(300, 0, 0.3, 'sine', 0.12, 700); break;
        case 'place': this.tone(500, 0, 0.1, 'triangle', 0.1, 750); break;
        case 'travel': this.travel(7); Music.duck('trip', 0.45); break;
        case 'travel2d': this.travel(1.5); Music.duck('trip', 0.45); break;
        case 'arrive': this.arrive(); setTimeout(() => Music.duck('trip', 1), 1200); break;
      }
    } catch (e) { /* audio not available */ }
  },
  voiceOf(c) {
    if (c.kind === 'sea') return 'splash';
    if (c.kind === 'ptero' || c.len < 2.5) return 'chirp';
    if (c.diet === 'meat' || c.diet === 'fish') return 'roar';
    return 'honk';
  }
};

const Music = {
  buf: null, loading: null, src: null, gain: null, ducks: {},
  on() { return S.settings.music !== false; },
  level() { return 0.22 * Math.min(1, ...Object.values(this.ducks)); },
  async start() {
    if (!this.on() || this.src) return;
    Sfx.unlock(); const c = Sfx.ctx; if (!c) return;
    if (!this.buf) {
      this.loading = this.loading || fetch('assets/music/theme.m4a?v=1790901068').then(r => r.arrayBuffer()).then(a => new Promise((ok, no) => c.decodeAudioData(a, ok, no)));
      try { this.buf = await this.loading; } catch (e) { this.loading = null; return; }
    }
    if (!this.on() || this.src) return;
    if (!this.gain) { this.gain = c.createGain(); this.gain.connect(c.destination); }
    const s = c.createBufferSource(); s.buffer = this.buf; s.loop = true; s.connect(this.gain);
    const t = c.currentTime; this.gain.gain.cancelScheduledValues(t); this.gain.gain.setValueAtTime(0.0001, t); this.gain.gain.exponentialRampToValueAtTime(this.level(), t + 3);
    s.start(); this.src = s;
  },
  stop() {
    const s = this.src; if (!s) return; this.src = null;
    const t = Sfx.ctx.currentTime; this.gain.gain.cancelScheduledValues(t); this.gain.gain.setTargetAtTime(0.0001, t, 0.3);
    setTimeout(() => { try { s.stop(); } catch (e) { /* already stopped */ } }, 1500);
  },
  sync() { if (this.on()) this.start(); else this.stop(); },
  duck(why, v) {
    this.ducks[why] = v;
    if (this.src) { const t = Sfx.ctx.currentTime; this.gain.gain.cancelScheduledValues(t); this.gain.gain.setTargetAtTime(this.level(), t, 0.15); }
  }
};

function travel(era) {
  if (window.Dino3D) { window.Dino3D.timeTravel(era, () => go('era', era)); return; }
  // the 3D engine is still downloading (the iPad can take a few seconds after the page opens): wait for it rather than showing the map
  if (window.Dino3DReady && !travel.waiting) {
    travel.waiting = true; toast('⏳ Getting the Time Machine ready…', 2500);
    Promise.race([window.Dino3DReady, new Promise(r => setTimeout(() => r(null), 20000))]).then(D3 => { travel.waiting = false; if (D3) travel(era); else { window.Dino3DReady = null; travel(era); } });
    return;
  }
  if (travel.waiting) return;
  window.reportProblem && reportProblem('3D engine missing when travelling to ' + era);
  if (location.protocol === 'file:') {
    const msg = 'The 3D Time Machine needs the game to be started properly. On the Mac, double-click Start Dino Explorer.command, then go to localhost:8000 in the browser. For now, here is the map view.';
    toast('🦖 ' + msg, 6500);
  }
  Sfx.play('travel2d');
  const E = ERAS[era];
  const o = el(`<div class="travel t-${era}"><div class="swirl">🌀</div><p>Travelling back to the <b>${E.name}</b>…<br><small>${E.years}</small></p></div>`);
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add('in'));
  setTimeout(() => { Sfx.play('arrive'); go('era', era); o.classList.add('out'); setTimeout(() => o.remove(), 600); }, 1500);
}

function buildScene(scene, scroller, theme, items, opts = {}) {
  const H = scroller.clientHeight, VW = scroller.clientWidth;
  const K = Math.max(0.5, Math.min(1.3, H / 600, VW / 450));
  const T = theme === 'park' ? PARK_THEME : ERAS[theme];
  const land = items.filter(i => i.c.kind !== 'sea' && i.c.kind !== 'ptero');
  const sea = items.filter(i => i.c.kind === 'sea');
  const sky = items.filter(i => i.c.kind === 'ptero');
  const leftPad = opts.leftPad || 0;
  const seaW = (opts.lagoon || sea.length) ? Math.max(360 * K, sea.length * 170 * K) : 0;
  const landW = Math.max(VW * (opts.minScreens || 1.2) - seaW, leftPad + land.reduce((s, i) => s + Math.min(sizeOf(i.c, K) * (i.scale || 1), 260 * K) * 0.8 + 40 * K, 60));
  const W = Math.round(landW + seaW);
  const horizon = Math.round(H * 0.42), groundH = H - horizon;
  scene.style.width = W + 'px';
  scene.style.height = H + 'px';
  scene.style.setProperty('--sky1', T.sky[0]); scene.style.setProperty('--sky2', T.sky[1]);
  scene.style.setProperty('--g1', T.ground[0]); scene.style.setProperty('--g2', T.ground[1]);
  // hills
  let hp = `M0 100`, x = 0;
  const R = Math.random;
  while (x < W) { const w = 120 + R() * 220, h = 30 + R() * 55; hp += ` Q${Math.round(x + w / 2)} ${Math.round(100 - h * 2)} ${Math.round(x + w)} 100`; x += w; }
  hp += ` L${W} 100Z`;
  let volc = '', smokeX = 0;
  if (theme === 'triassic' || theme === 'cretaceous') {
    smokeX = Math.round(W * 0.35 + R() * W * 0.3);
    volc = `<path d="M${smokeX - 90} 100L${smokeX - 22} 12L${smokeX + 22} 12L${smokeX + 90} 100Z" fill="${Art.shade(T.hill, -0.2)}"/><path d="M${smokeX - 22} 12L${smokeX + 22} 12L${smokeX + 16} 22L${smokeX - 16} 22Z" fill="#e0582a"/>`;
  }
  let clouds = '';
  for (let cx = 80; cx < W; cx += 260 + R() * 260) clouds += `<span class="cloud" style="left:${Math.round(cx)}px;top:${Math.round(4 + R() * 16)}%;font-size:${Math.round((40 + R() * 30) * K)}px">☁️</span>`;
  const hillTop = horizon - Math.round(H * 0.2);
  scene.innerHTML = `<div class="sky"></div><div class="sun"></div>${clouds}
    <svg class="hills" viewBox="0 0 ${W} 100" preserveAspectRatio="none" style="top:${hillTop}px;height:${Math.round(H * 0.2) + 2}px">${volc}<path d="${hp}" fill="${T.hill}"/></svg>
    ${volc ? `<span class="smoke" style="left:${smokeX}px;top:${hillTop - Math.round(30 * K)}px;font-size:${Math.round(36 * K)}px">💨</span>` : ''}
    <div class="ground" style="top:${horizon}px"></div>
    ${seaW ? `<div class="sea" style="left:${Math.round(landW)}px;top:${horizon + 4}px"><div class="waves"></div></div>` : ''}
    <div class="layer"></div>`;
  const layer = scene.querySelector('.layer');
  // plants
  const plants = T.plants || [];
  for (let px = leftPad + 20; px < landW - 30 && plants.length; px += (45 + R() * 75)) {
    const back = R() < 0.45;
    const b = back ? groundH - 12 - R() * 20 : R() * groundH * 0.8;
    const size = (back ? 70 + R() * 50 : 30 + R() * 34) * K * (1 - b / groundH * 0.35);
    layer.appendChild(el(`<span class="plant" style="left:${Math.round(px)}px;bottom:${Math.round(b)}px;font-size:${Math.round(size)}px;z-index:${Math.round(1000 - b)}">${pick(plants)}</span>`));
  }
  // actors
  const actors = [];
  const place = (item, zone, i, count) => {
    const c = item.c, s = Art.svg(c);
    const w = Math.min(sizeOf(c, K) * (item.scale || 1), 300 * K), h = w * s.h / s.w;
    const a = el(`<div class="actor k-${c.kind}${item.cls ? ' ' + item.cls : ''}" data-id="${c.id}" role="button" aria-label="${esc(item.p && item.p.nick ? item.p.nick : 'Creature')}" style="width:${Math.round(w)}px"><div class="flip"><div class="bob" style="animation-delay:-${(R() * 3).toFixed(2)}s">${s.html}</div></div>${item.badge || ''}</div>`);
    let min, max, bottom;
    if (zone === 'land') {
      min = leftPad; max = Math.max(min + 10, landW - w - 10);
      bottom = Math.min(groundH * 0.72, H - h - 40) * (0.08 + 0.92 * R());
    } else if (zone === 'sea') {
      min = landW + 16; max = Math.max(min + 10, W - w - 10);
      bottom = Math.min(groundH * 0.55, H - h - 30) * (0.1 + 0.9 * R());
    } else {
      min = 0; max = W - w;
      bottom = groundH + 16 + R() * Math.max(10, H - groundH - h - 70);
    }
    bottom = Math.max(4, Math.min(bottom, H - h - (zone === 'sky' ? 60 : 8)));
    const startX = zone === 'land' ? min + (max - min) * ((i + 0.5) / count) + (R() - 0.5) * 40 : min + R() * (max - min);
    const A = { el: a, c, item, w, h, zone, min, max, x: Math.max(min, Math.min(max, startX)), bottom, dir: R() < 0.5 ? -1 : 1, wait: R() * 3, target: 0, walking: false,
      speed: (zone === 'sky' ? 34 + R() * 20 : zone === 'sea' ? 18 + R() * 12 : 10 + R() * 16) * K };
    A.target = A.x;
    A.flipEl = a.querySelector('.flip');
    a.style.bottom = Math.round(bottom) + 'px';
    a.style.zIndex = zone === 'sky' ? 1500 : Math.round(1000 - bottom);
    a.style.transform = `translate3d(${Math.round(A.x)}px,0,0)`;
    if (A.dir < 0) A.flipEl.style.transform = 'scaleX(-1)';
    a.addEventListener('click', ev => { ev.stopPropagation(); if (opts.onTap) opts.onTap(A); });
    layer.appendChild(a);
    actors.push(A);
  };
  shuffle(land).forEach((it, i, arr) => place(it, 'land', i, arr.length));
  sea.forEach((it, i, arr) => place(it, 'sea', i, arr.length));
  sky.forEach((it, i, arr) => place(it, 'sky', i, arr.length));

  let raf = 0, last = performance.now(), paused = false;
  const tick = t => {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (!paused) for (const a of actors) {
      if (a.hold) continue;
      if (a.wait > 0) { a.wait -= dt; continue; }
      const d = a.target - a.x;
      if (Math.abs(d) < 2) {
        a.wait = 1.5 + Math.random() * 5;
        a.target = a.min + Math.random() * (a.max - a.min);
        if (a.walking) { a.walking = false; a.el.classList.remove('walking'); }
        continue;
      }
      const dir = Math.sign(d);
      if (dir !== a.dir) { a.dir = dir; a.flipEl.style.transform = dir < 0 ? 'scaleX(-1)' : ''; }
      if (!a.walking) { a.walking = true; a.el.classList.add('walking'); }
      a.x += dir * Math.min(Math.abs(d), a.speed * dt);
      a.el.style.transform = `translate3d(${Math.round(a.x)}px,0,0)`;
    }
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
  const onVis = () => { paused = document.hidden; last = performance.now(); };
  document.addEventListener('visibilitychange', onVis);
  return { actors, W, H, K, landW, horizon, groundH, layer,
    stop() { cancelAnimationFrame(raf); document.removeEventListener('visibilitychange', onVis); } };
}

// ================= ERA =================
SCREENS.era = (app, era) => {
  if (!window.Dino3D && window.Dino3DReady) { app.innerHTML = bar('⏳ Time Machine') + '<div class="t3-err">⏳ Getting the trail ready…</div>'; window.Dino3DReady.then(() => { if (current === 'era') go('era', era); }); return; }
  if (window.Dino3D && window.Dino3D.hasTrail(era)) return trail3D(app, era);
  SCREENS.field(app, era);
};
function eraIntro(era) {
  const E = ERAS[era], list = CREATURES.filter(c => c.era === era);
  const m = modal(`<div class="era-intro i-${era}"><div class="ei-emoji">${E.emoji}</div><h2>The ${E.name} ${spk(E.intro)}</h2><p class="years">${E.years}</p><p>${E.intro}</p><p class="tip">👆 Walk the trail and take photos 📷 of the creatures to discover them. There are ${list.length} creatures hiding here.</p><button class="pill ok-btn">Let's go!</button></div>`);
  $('.ok-btn', m).onclick = m.close;
  return m;
}
function trail3D(app, era) {
  const E = ERAS[era];
  app.innerHTML = bar(`${E.emoji} ${E.name} trail`, { back: 'timemachine', extra: `<button class="btn-round info-btn" aria-label="About this time">ℹ️</button>` }) + `<div class="trail-host"></div>`;
  const host = $('.trail-host', app);
  window.Dino3D.startTrail(host, era).catch(err => {
    window.reportProblem && reportProblem('trail ' + era + ' failed: ' + (err && (err.stack || err.message) || err));
    host.innerHTML = '<p class="t3-err">Sorry, this device could not start the 3D trail.<br><button class="pill map-btn">🗺️ Use the map instead</button></p>';
    $('.map-btn', host).onclick = () => go('field', era);
  });
  cleanup = () => window.Dino3D.stopTrail();
  $('.info-btn', app).onclick = () => eraIntro(era);
  if (!S.eraSeen[era]) { S.eraSeen[era] = 1; save(); setTimeout(() => { if (current === 'era') eraIntro(era); }, 900); }
}
SCREENS.field = (app, era) => {
  const E = ERAS[era], list = CREATURES.filter(c => c.era === era);
  const has3D = window.Dino3D && window.Dino3D.hasTrail(era);
  app.innerHTML = bar(`${E.emoji} ${E.name}`, { back: has3D ? 'era' : 'timemachine', extra: `<button class="btn-round info-btn" aria-label="About this time">ℹ️</button>` }).replace('data-go="era"', `data-go="era" data-arg="${era}"`) +
    `<div class="hud"><span class="found-count"></span><button class="pill hint">🔍 Help me find one</button></div><div class="scroller"><div class="scene"></div></div>`;
  const scroller = $('.scroller', app), scene = $('.scene', app);
  const items = list.map(c => ({ c, badge: S.found[c.id] ? '' : '<div class="qmark">?</div>' }));
  const world = buildScene(scene, scroller, era, items, { minScreens: 1.4, onTap: a => discover(a) });
  cleanup = () => world.stop();
  const count = () => {
    const f = list.filter(c => S.found[c.id]).length;
    $('.found-count', app).innerHTML = f === list.length ? `🎉 You found all ${list.length}!` : `🔎 Found <b>${f}</b> of ${list.length}`;
  };
  count();
  $('.info-btn', app).onclick = () => eraIntro(era);
  if (!S.eraSeen[era]) { S.eraSeen[era] = 1; save(); setTimeout(() => eraIntro(era), 500); }
  $('.hint', app).onclick = () => {
    const a = world.actors.find(x => !S.found[x.c.id]);
    if (!a) { toast('🎉 You found everyone here! Try another time.'); return; }
    scroller.scrollTo({ left: Math.max(0, a.x + a.w / 2 - scroller.clientWidth / 2), behavior: 'smooth' });
    a.hold = true; a.el.classList.add('glow');
    setTimeout(() => { a.hold = false; a.el.classList.remove('glow'); }, 3500);
  };
  function discover(a) {
    const c = a.c;
    Sfx.play(Sfx.voiceOf(c));
    a.el.classList.remove('hop'); void a.el.offsetWidth; a.el.classList.add('hop');
    const isNew = !S.found[c.id];
    if (isNew) {
      S.found[c.id] = Date.now(); S.stars += 1; save(); updateStars();
      const q = a.el.querySelector('.qmark'); if (q) q.remove();
      burst(a.el, ['✨', '⭐'], 6);
      count();
    }
    setTimeout(() => factCard(c, { isNew, from: 'era' }), isNew ? 550 : 250);
    if (isNew) checkBadges();
  }
};

function moreAbout(c) {
  const facts = MORE[c.id] || [];
  const all = [`More about ${c.name}.`, ...facts.map(f => noFlags(f.replace(/^\S+\s/, '')))].join(' ');
  const m = modal(`
    <div class="card more c-${c.era}">
      <div class="card-pic"><img class="real-pic" src="assets/portraits/${c.id}.webp" alt=""></div>
      <h2>More about ${esc(nm(c))} ${spk(`More about ${c.name}`)}</h2>
      <button class="pill readall" data-say="${esc(all)}">🔊 Read me everything</button>
      <ul class="facts more-facts">${facts.map(f => { const [e, ...rest] = f.split(' '), t = rest.join(' '); return `<li>${spk(t)}<span><b class="mf-e">${e}</b> ${esc(t)}</span></li>`; }).join('')}</ul>
